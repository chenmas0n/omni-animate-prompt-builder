<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omni-Animate Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --ink:#0a0a0a; --paper:#f5f3f0; --stone:#d4d0ca; --steel:#8a8680; --dim:#b8b4ae;
    --accent:#e63920; --body:#3a3835;
    --mono:'Space Mono', monospace;
    --sans:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html { scroll-behavior:smooth; }
  body {
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  /* Grain overlay */
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; opacity:.03; z-index:9999;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }
  ::-webkit-scrollbar { width:10px; height:10px; background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--stone); border-radius:5px; }

  .container { max-width:960px; margin:0 auto; padding:0 2rem; }

  /* ---- masthead ---- */
  .masthead { padding:2.5rem 0 0; text-align:center; }
  .masthead .eyebrow {
    font-family:var(--mono); font-size:.65rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--steel); margin-bottom:.6rem;
  }
  .masthead h1 {
    font-size:clamp(1.6rem,3.6vw,2.3rem); font-weight:700; letter-spacing:-.025em; line-height:1.1;
  }
  .masthead h1 span { color:var(--accent); }

  /* ---- step rail ---- */
  .rail {
    display:flex; justify-content:center; flex-wrap:wrap; gap:0 1rem;
    margin:2rem 0 0; padding:1rem 0 0; border-top:1px solid var(--stone);
  }
  .rstep {
    appearance:none; border:0; background:transparent; cursor:pointer; white-space:nowrap;
    font-family:var(--mono); font-size:.575rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--dim); padding:.35rem 0; display:inline-flex; align-items:center; gap:.45rem;
    border-bottom:1.5px solid transparent; transition:color .2s, border-color .2s;
  }
  .rstep:hover { color:var(--ink); }
  .rstep[aria-current="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .rstep .n { color:var(--dim); }
  .rstep.done .n { color:var(--accent); }
  .rstep[aria-current="true"] .n { color:var(--accent); }

  /* ---- step ---- */
  main { padding:3.5rem 0 5rem; }
  /* Only a real step change animates — an in-step re-render must not replay it. */
  .step.enter { animation:fadeUp .45s ease both; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce) { .step.enter { animation:none; } }

  .step-num {
    font-family:var(--mono); font-size:.65rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--dim); margin-bottom:.75rem; text-align:center;
  }
  .step h2 {
    font-size:clamp(1.8rem,4vw,2.8rem); font-weight:700; letter-spacing:-.02em; line-height:1.15;
    text-align:center; max-width:20ch; margin:0 auto;
  }
  .step .lede {
    color:var(--body); font-size:1rem; line-height:1.7; text-align:center;
    max-width:56ch; margin:1rem auto 0;
  }
  .rule { width:48px; height:2px; background:var(--ink); margin:2rem auto 0; }

  .field { margin-top:3rem; }
  .field > label, .grouplabel {
    display:block; font-family:var(--mono); font-size:.7rem; font-weight:700;
    letter-spacing:.15em; text-transform:uppercase; color:var(--ink); margin-bottom:1rem; text-align:center;
  }
  .grouplabel {
    font-weight:400; color:var(--steel); font-size:.62rem; margin-top:1.5rem; letter-spacing:.18em;
  }
  .grouplabel:first-child { margin-top:0; }
  .optional { text-transform:none; letter-spacing:0; font-weight:400; color:var(--dim); font-family:var(--sans); }

  /* ---- cards ---- */
  .cards {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
    gap:.85rem; max-width:840px; margin:0 auto;
  }
  .card {
    appearance:none; cursor:pointer; font:inherit; text-align:center; position:relative;
    background:#fff; border:1px solid var(--stone); border-radius:6px; padding:6px 6px 9px;
    display:flex; flex-direction:column; gap:8px; transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .more {
    appearance:none; background:transparent; border:0; cursor:pointer; display:block; margin:1.25rem auto 0;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent); border-bottom:1px solid transparent; padding-bottom:2px;
  }
  .more:hover { border-bottom-color:var(--accent); }
  .card:hover { border-color:var(--steel); transform:translateY(-2px); }
  .card[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card .frame {
    position:relative; width:100%; aspect-ratio:1/1; border-radius:3px; overflow:hidden; background:#191a1e;
  }
  .card .cap {
    font-family:var(--sans); font-size:.78rem; font-weight:500; line-height:1.25; color:var(--steel);
    min-height:2.1em; display:flex; align-items:center; justify-content:center; padding:0 3px; transition:color .2s;
  }
  .card:hover .cap { color:var(--ink); }
  .card[aria-pressed="true"] .cap { color:var(--ink); font-weight:700; }
  .card .ord {
    display:none; position:absolute; top:8px; right:8px; z-index:2; min-width:16px; height:16px;
    padding:0 4px; border-radius:8px; background:var(--accent); color:#fff;
    font-family:var(--mono); font-size:9px; font-weight:700; line-height:16px;
  }
  .card[aria-pressed="true"] .ord.on { display:block; }
  .pv { display:block; width:100%; height:100%; }

  /* Motion plays on hover only — a selected card holds still. */
  .pv .anim {
    animation-name:var(--a); animation-duration:var(--ad,2.4s);
    animation-timing-function:var(--ae,cubic-bezier(.45,0,.55,1));
    animation-iteration-count:infinite; animation-direction:var(--adir,alternate);
    animation-play-state:paused; transform-box:fill-box; transform-origin:center;
  }
  .card:hover .pv .anim, .preset:hover .pv .anim { animation-play-state:running; }
  @media (prefers-reduced-motion:reduce) { .pv .anim { animation:none !important; } }

  @keyframes zin    { from{transform:scale(1)}          to{transform:scale(1.38)} }
  @keyframes zout   { from{transform:scale(1.38)}       to{transform:scale(1)} }
  @keyframes txL    { from{transform:translateX(13px)}  to{transform:translateX(-13px)} }
  @keyframes txR    { from{transform:translateX(-13px)} to{transform:translateX(13px)} }
  @keyframes tyU    { from{transform:translateY(-11px)} to{transform:translateY(11px)} }
  @keyframes tyD    { from{transform:translateY(11px)}  to{transform:translateY(-11px)} }
  @keyframes panL   { from{transform:translateX(15px) skewY(-2deg)}  to{transform:translateX(-15px) skewY(2deg)} }
  @keyframes panR   { from{transform:translateX(-15px) skewY(2deg)}  to{transform:translateX(15px) skewY(-2deg)} }
  @keyframes tiltU  { from{transform:translateY(-13px) scaleY(1.05)} to{transform:translateY(13px) scaleY(.95)} }
  @keyframes tiltD  { from{transform:translateY(13px) scaleY(.95)}   to{transform:translateY(-13px) scaleY(1.05)} }
  @keyframes craneU { from{transform:translateY(0) scale(1)}         to{transform:translateY(17px) scale(.84)} }
  @keyframes orbL   { from{transform:perspective(190px) rotateY(-26deg)} to{transform:perspective(190px) rotateY(26deg)} }
  @keyframes orbR   { from{transform:perspective(190px) rotateY(26deg)}  to{transform:perspective(190px) rotateY(-26deg)} }
  @keyframes spin   { from{transform:perspective(210px) rotateY(0deg)}   to{transform:perspective(210px) rotateY(360deg)} }
  @keyframes reveal { from{transform:perspective(200px) rotateY(-34deg)} to{transform:perspective(200px) rotateY(34deg)} }
  @keyframes hand   {
    0%{transform:translate(0,0) rotate(0)}      18%{transform:translate(2.6px,-1.8px) rotate(.7deg)}
    36%{transform:translate(-1.8px,1.4px) rotate(-.6deg)} 54%{transform:translate(1.4px,2px) rotate(.5deg)}
    72%{transform:translate(-2.4px,-1.2px) rotate(-.7deg)} 100%{transform:translate(0,0) rotate(0)}
  }
  @keyframes steady { 0%{transform:translate(-11px,0)} 50%{transform:translate(0,-2.5px)} 100%{transform:translate(11px,0)} }
  @keyframes whip   { 0%{transform:translateX(0);opacity:1} 42%{transform:translateX(-46px);opacity:.25}
                      58%{transform:translateX(46px);opacity:.25} 100%{transform:translateX(0);opacity:1} }
  @keyframes heroP  { from{transform:perspective(200px) translateZ(0) rotateY(14deg)} to{transform:perspective(200px) translateZ(30px) rotateY(-6deg)} }
  @keyframes descend{ from{transform:perspective(200px) rotateX(46deg) translateY(-6px)} to{transform:perspective(200px) rotateX(4deg) translateY(4px)} }
  @keyframes crawl  { from{transform:translateX(20px) scale(1.5)} to{transform:translateX(-20px) scale(1.5)} }
  @keyframes plxF   { from{transform:translateX(-16px)} to{transform:translateX(16px)} }
  @keyframes plxB   { from{transform:translateX(-5px)}  to{transform:translateX(5px)} }
  @keyframes boom   { from{transform:translate(0,0)}    to{transform:translate(var(--ex),var(--ey))} }
  @keyframes sharpen{ from{opacity:0} to{opacity:1} }
  @keyframes soften { from{opacity:1} to{opacity:0} }
  @keyframes mix    { from{opacity:.45} to{opacity:1} }
  @keyframes dzS    { from{transform:scale(1)} to{transform:scale(1.55)} }
  @keyframes dzB    { from{transform:scale(1.4)} to{transform:scale(.8)} }
  @keyframes slideIn{ from{transform:translateX(-100px)} to{transform:translateX(0)} }
  @keyframes slideOut{from{transform:translateX(0)} to{transform:translateX(100px)} }
  @keyframes bloom  { from{opacity:.45;transform:scale(.9)} to{opacity:1;transform:scale(2.3)} }
  @keyframes drift  { from{transform:translate(0,4px)} to{transform:translate(3px,-4px)} }
  @keyframes breathe{ from{transform:scale(.94)} to{transform:scale(1.06)} }
  @keyframes fill   { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  @keyframes march  { from{transform:translateX(-17px)} to{transform:translateX(17px)} }

  /* ---- presets ---- */
  .presets { display:grid; grid-template-columns:repeat(auto-fill,minmax(370px,1fr)); gap:1rem; }
  .preset {
    appearance:none; cursor:pointer; font:inherit; text-align:left; display:flex; gap:1rem; align-items:flex-start;
    background:#fff; border:1px solid var(--stone); border-radius:6px; padding:1rem;
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .preset:hover { border-color:var(--steel); transform:translateY(-2px); }
  .preset[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .preset:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .preset .thumb { width:92px; height:92px; flex:none; border-radius:4px; overflow:hidden; background:#191a1e; }
  .preset .txt { min-width:0; }
  .preset .txt h4 { font-size:1rem; font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  .preset .txt p { font-size:.8rem; color:var(--steel); line-height:1.5; margin-top:.3rem; }
  .preset .beats { display:flex; flex-direction:column; gap:.15rem; margin-top:.6rem; }
  .preset .beat {
    font-family:var(--mono); font-size:.58rem; letter-spacing:.04em; color:var(--steel);
    display:flex; gap:.4rem; align-items:baseline;
  }
  .preset .beat b { color:var(--accent); font-weight:700; }
  .preset .beat i { font-style:normal; color:var(--dim); margin-left:auto; }
  .preset .meta {
    display:block; margin-top:.55rem; font-family:var(--mono); font-size:.6rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  }
  .preset[aria-pressed="true"] .meta { color:var(--accent); }

  /* ---- collapsible preset groups ---- */
  .groupbtn {
    appearance:none; cursor:pointer; width:100%; display:flex; align-items:center; gap:.7rem;
    background:transparent; border:0; border-bottom:1px solid var(--stone); padding:.9rem .25rem;
    margin-top:1.5rem; font-family:var(--mono); font-size:.68rem; font-weight:700;
    letter-spacing:.15em; text-transform:uppercase; color:var(--ink); transition:color .2s;
  }
  .groupbtn:first-child { margin-top:0; }
  .groupbtn:hover { color:var(--accent); }
  .groupbtn .caret {
    width:18px; height:18px; flex:none; border:1px solid var(--stone); border-radius:3px;
    display:grid; place-items:center; font-size:.8rem; color:var(--steel);
  }
  .groupbtn.open .caret { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .groupbtn .gname { margin-right:auto; }
  .groupbtn .gcount { font-weight:400; color:var(--dim); letter-spacing:.1em; }
  .groupbtn + .presets { margin-top:1.1rem; }

  /* ---- reference auto-extraction ---- */
  .swatches { display:flex; gap:3px; margin-bottom:.5rem; }
  .sw { width:100%; height:18px; border-radius:2px; border:1px solid rgba(0,0,0,.08); }
  .autotags { display:flex; flex-wrap:wrap; gap:.25rem; }
  .autotag {
    font-family:var(--mono); font-size:.55rem; letter-spacing:.08em; text-transform:uppercase;
    background:var(--paper); border:1px solid var(--stone); border-radius:3px;
    padding:.18rem .42rem; color:var(--steel);
  }

  /* ---- vision panel ---- */
  .vpanel {
    max-width:640px; margin:0 auto 1.5rem; background:#fff; border:1px solid var(--stone);
    border-radius:6px; padding:1rem 1.15rem 1.1rem; text-align:left;
  }
  .vhead { display:flex; align-items:center; gap:1rem; }
  .vlabel {
    font-family:var(--mono); font-size:.65rem; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--ink); margin-right:auto;
  }
  .vpct { font-family:var(--mono); font-size:.65rem; color:var(--steel); font-variant-numeric:tabular-nums; }
  .keyrow { display:flex; gap:.4rem; margin-top:.8rem; }
  .keyinput {
    flex:1; min-width:0; font-family:var(--mono); font-size:.78rem; letter-spacing:.02em;
    padding:.5rem .65rem;
  }
  .vpanel code {
    font-family:var(--mono); font-size:.92em; background:rgba(0,0,0,.05);
    padding:.05em .3em; border-radius:3px;
  }
  .vpanel .hint { text-align:left; }
  .vwarn { color:var(--accent); }
  .vclear {
    appearance:none; background:transparent; border:0; padding:0; cursor:pointer;
    font-family:var(--mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); border-bottom:1px solid transparent;
  }
  .vclear:hover { color:var(--accent); border-bottom-color:var(--accent); }
  .subjrow { display:flex; gap:.35rem; align-items:stretch; }
  .subjrow input { flex:1; min-width:0; }
  .vone {
    appearance:none; cursor:pointer; flex:none; width:32px; border:1px solid var(--stone);
    border-radius:6px; background:#fff; font-size:.85rem; line-height:1; color:var(--steel);
  }
  .vone:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .vone:disabled { opacity:.4; cursor:default; }
  .eltag {
    font-family:var(--sans); font-size:.68rem; letter-spacing:0; text-transform:none;
    background:rgba(230,57,32,.07); border:1px solid rgba(230,57,32,.28); border-radius:3px;
    padding:.16rem .42rem; color:#8f2a17;
  }
  .refdetail {
    font-size:.72rem; line-height:1.5; color:var(--steel); margin-bottom:.2rem;
    max-height:4.5em; overflow:hidden;
  }

  /* ---- storyboard tiles ---- */
  .tiles {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:.75rem; max-width:760px; margin:0 auto 1.5rem;
  }
  .tile {
    appearance:none; cursor:pointer; font:inherit; text-align:left; position:relative;
    background:#fff; border:1px solid var(--stone); border-radius:6px; padding:5px 5px 7px;
    display:flex; flex-direction:column; gap:6px; transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .tile:hover { border-color:var(--steel); transform:translateY(-2px); }
  .tile[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tframe {
    position:relative; display:block; width:100%; aspect-ratio:1/1; border-radius:3px;
    overflow:hidden; background:#191a1e;
  }
  .tnum, .tdur {
    position:absolute; font-family:var(--mono); font-size:.55rem; font-weight:700; letter-spacing:.05em;
    background:rgba(10,10,10,.82); color:var(--paper); padding:.1rem .3rem; border-radius:2px;
  }
  .tnum { top:4px; left:4px; }
  .tdur { bottom:4px; right:4px; }
  .tile[aria-pressed="true"] .tnum { background:var(--accent); }
  .tcap {
    font-size:.68rem; line-height:1.3; color:var(--steel); padding:0 2px;
    min-height:2.6em; overflow:hidden;
  }
  .tcap em { color:var(--dim); font-style:normal; }
  .tile[aria-pressed="true"] .tcap { color:var(--ink); }
  .addtile .tframe { background:transparent; border:1.5px dashed var(--stone); display:grid; place-items:center; }
  .addtile .plus { font-size:1.6rem; color:var(--stone); line-height:1; }
  .addtile:hover .tframe { border-color:var(--accent); }
  .addtile:hover .plus { color:var(--accent); }

  /* ---- shot list ---- */
  .runbar { display:flex; align-items:center; gap:1rem; max-width:760px; margin:0 auto 1.5rem; }
  .runlabel, .runval {
    font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--steel);
  }
  .runval { color:var(--ink); font-weight:700; }
  .runval.full { color:var(--accent); }
  .runbar .bar { flex:1; height:4px; background:var(--stone); border-radius:2px; overflow:hidden; display:flex; gap:1px; margin:0; }
  .bar span { background:var(--ink); height:100%; }
  .bar span:nth-child(even) { background:var(--steel); }

  .shotcard {
    max-width:760px; margin:0 auto 1rem; background:#fff; border:1px solid var(--stone);
    border-radius:6px; padding:1.1rem 1.25rem 1.25rem; text-align:left;
  }
  .shotcard.look { background:rgba(0,0,0,.02); }
  .shothead { display:flex; align-items:center; gap:.6rem; margin-bottom:.9rem; }
  .shotn {
    font-family:var(--mono); font-size:.7rem; font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; margin-right:auto;
  }
  .shotdur { font-family:var(--mono); font-size:.9rem; font-weight:700; min-width:3ch; text-align:center; }
  .shotdel {
    appearance:none; background:transparent; border:0; cursor:pointer; margin-left:.5rem;
    font-family:var(--mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  }
  .shotdel:hover { color:var(--accent); }
  .shottext {
    width:100%; background:transparent; border:0; border-bottom:1px solid var(--stone); border-radius:0;
    padding:.5rem 0; font-family:var(--sans); font-size:.95rem; line-height:1.6; color:var(--ink); resize:vertical;
  }
  .shottext.sub { font-size:.85rem; color:var(--body); }
  .shottext:focus { outline:none; border-bottom-color:var(--ink); }
  .refins { display:flex; gap:.35rem; margin-top:.5rem; }
  .refchip {
    appearance:none; cursor:pointer; background:transparent; border:1px solid var(--stone); border-radius:3px;
    font-family:var(--mono); font-size:.55rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--steel); padding:.2rem .45rem;
  }
  .refchip:hover { border-color:var(--accent); color:var(--accent); }

  .setrow { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:1rem; }
  .setchip {
    appearance:none; cursor:pointer; text-align:left; background:var(--paper);
    border:1px solid transparent; border-radius:4px; padding:.3rem .55rem; transition:border-color .15s, background .15s;
  }
  .setchip:hover { border-color:var(--stone); background:#fff; }
  .setchip[aria-pressed="true"] { border-color:var(--accent); background:#fff; }
  .setchip .k {
    display:block; font-family:var(--mono); font-size:.52rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--dim);
  }
  .setchip .v { display:block; font-family:var(--sans); font-size:.78rem; font-weight:500; color:var(--ink); }
  .setchip.unset .v { color:var(--dim); }
  .editor { margin-top:1rem; padding-top:1rem; border-top:1px solid var(--stone); }
  .editor .field { margin-top:0; }
  .editor .cards { max-width:none; }
  .addshot {
    display:block; max-width:760px; margin:0 auto 1rem; width:100%;
    appearance:none; cursor:pointer; background:transparent; border:1.5px dashed var(--stone);
    border-radius:6px; padding:.9rem; font-family:var(--sans); font-size:.85rem; color:var(--steel);
  }
  .addshot:hover { border-color:var(--accent); color:var(--accent); }

  /* ---- chips ---- */
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; }
  .chip {
    appearance:none; cursor:pointer; font-family:var(--sans); font-size:.85rem; font-weight:500;
    background:#fff; color:var(--body); border:1px solid var(--stone); border-radius:6px;
    padding:.6rem 1.1rem; transition:border-color .2s, background .2s, color .2s;
  }
  .chip:hover { border-color:var(--steel); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .chip small { display:block; font-size:.7rem; font-weight:400; opacity:.7; margin-top:.15rem; }
  .chip.num { min-width:3rem; font-family:var(--mono); }

  /* ---- shot tabs ---- */
  /* Hugs its content so there's no dead gap before "Apply to all". */
  .shotbar { display:flex; justify-content:center; margin:2.5rem 0 0; }
  .shottabs {
    display:inline-flex; align-items:stretch; flex-wrap:wrap; gap:0;
    border:1px solid var(--stone); border-radius:6px; overflow:hidden; background:#fff;
  }
  .stab {
    appearance:none; border:0; border-right:1px solid var(--stone); background:#fff; cursor:pointer;
    font-family:var(--mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--steel); padding:.7rem 1.1rem; transition:background .2s, color .2s;
  }
  .stab:hover { background:var(--paper); color:var(--ink); }
  .stab[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .stab .mark { color:var(--accent); margin-left:.4rem; }
  .stab[aria-pressed="true"] .mark { color:var(--accent); }
  .applyall {
    border-right:0; border-left:1px solid var(--stone); font-family:var(--sans);
    font-size:.75rem; text-transform:none; letter-spacing:0; color:var(--accent);
  }
  .applyall:hover { background:var(--accent); color:#fff; }

  /* ---- timing ---- */
  .budget { max-width:520px; margin:0 auto; }
  .budget-head {
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--steel);
  }
  .budget-head b { color:var(--ink); font-size:.8rem; }
  .budget-head b.full { color:var(--accent); }
  .bar { height:4px; background:var(--stone); border-radius:2px; margin:.6rem 0 1.5rem; overflow:hidden; display:flex; gap:1px; }
  .bar span { background:var(--ink); height:100%; }
  .bar span:nth-child(even) { background:var(--steel); }
  .durrow {
    display:flex; align-items:center; gap:1rem; padding:.7rem 0; border-bottom:1px solid var(--stone);
  }
  .durrow:last-child { border-bottom:0; }
  .durrow .lbl { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); margin-right:auto; }
  .durrow .val { font-family:var(--mono); font-size:1rem; font-weight:700; min-width:3ch; text-align:right; }
  .step-btn {
    appearance:none; width:28px; height:28px; border-radius:4px; border:1px solid var(--stone);
    background:#fff; color:var(--ink); cursor:pointer; font-size:1rem; line-height:1; font-family:var(--mono);
    transition:border-color .2s, background .2s;
  }
  .step-btn:hover:not(:disabled) { border-color:var(--ink); background:var(--ink); color:var(--paper); }
  .step-btn:disabled { opacity:.3; cursor:not-allowed; }

  /* ---- inputs ---- */
  .inputwrap { max-width:640px; margin:0 auto; }
  textarea, input[type="text"] {
    width:100%; background:#fff; color:var(--ink); border:1px solid var(--stone); border-radius:6px;
    padding:.85rem 1rem; font-family:var(--sans); font-size:.95rem; line-height:1.6; resize:vertical;
    transition:border-color .2s;
  }
  textarea:focus, input[type="text"]:focus { outline:none; border-color:var(--ink); }
  textarea::placeholder, input::placeholder { color:var(--dim); }
  .hint { color:var(--steel); font-size:.8rem; line-height:1.6; margin-top:.75rem; text-align:center; }

  /* ---- references ---- */
  .drop {
    max-width:640px; margin:0 auto; border:1.5px dashed var(--stone); border-radius:6px;
    padding:3rem 2rem; text-align:center; background:rgba(0,0,0,.02); cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .drop:hover, .drop.over { border-color:var(--accent); background:rgba(230,57,32,.04); }
  .drop strong { display:block; font-size:1rem; font-weight:700; margin-bottom:.35rem; }
  .drop span { color:var(--steel); font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; }
  .refgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1rem; margin-top:1.5rem; }
  .ref { background:#fff; border:1px solid var(--stone); border-radius:6px; overflow:hidden; }
  .ref .thumb { position:relative; aspect-ratio:16/10; background:var(--ink); }
  .ref .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .ref .tag {
    position:absolute; left:.5rem; top:.5rem; background:var(--ink); color:var(--paper);
    font-family:var(--mono); font-size:.55rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.25rem .5rem; border-radius:3px;
  }
  .ref .del {
    position:absolute; right:.4rem; top:.4rem; width:22px; height:22px; border-radius:3px;
    background:var(--ink); color:var(--paper); border:0; cursor:pointer; font-size:.8rem; line-height:1;
  }
  .ref .del:hover { background:var(--accent); }
  .ref .body { padding:.75rem .85rem .85rem; }
  .ref .cats { display:flex; flex-wrap:wrap; gap:.25rem; margin-bottom:.55rem; justify-content:flex-start; }
  .ref .cats .chip { padding:.2rem .5rem; font-size:.65rem; border-radius:4px; }
  .ref input[type="text"] { padding:.45rem .55rem; font-size:.82rem; }
  .reflabel {
    display:block; font-family:var(--mono); font-size:.52rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--dim); margin:.55rem 0 .3rem;
  }
  .reflabel:first-child { margin-top:0; }
  .refsubject { margin-bottom:.2rem; }
  .refphrase {
    margin-top:.7rem; padding-top:.6rem; border-top:1px solid var(--stone);
    font-size:.78rem; line-height:1.5; color:var(--body); font-style:italic;
  }
  .rebuild {
    display:block; max-width:760px; margin:0 auto 1.25rem; width:100%;
    appearance:none; cursor:pointer; background:transparent; border:1px solid var(--stone);
    border-radius:6px; padding:.6rem; font-family:var(--mono); font-size:.6rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--steel);
  }
  .rebuild:hover { border-color:var(--accent); color:var(--accent); }
  .rebuild[disabled] { opacity:.45; cursor:default; }
  .rebuild[disabled]:hover { border-color:var(--stone); color:var(--steel); }

  /* The shot list is written by a model on a network round-trip, so the wait
   * gets a real banner rather than a silently empty storyboard. */
  .directing {
    display:flex; align-items:center; justify-content:center; gap:.6rem;
    max-width:760px; margin:0 auto 1.25rem; width:100%;
    border:1px solid var(--accent); border-radius:6px; padding:.65rem;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent);
  }
  .directing .dot {
    width:.5rem; height:.5rem; border-radius:50%; background:currentColor;
    animation:dpulse 1s ease-in-out infinite;
  }
  @keyframes dpulse { 0%,100%{opacity:.25} 50%{opacity:1} }
  .dfail { border-color:var(--stone); color:var(--body); text-transform:none;
    font-family:var(--sans); font-size:.78rem; letter-spacing:0; font-style:italic; }

  /* ---- nav ---- */
  .nav {
    display:flex; align-items:center; justify-content:center; gap:1.5rem;
    margin-top:4rem; padding-top:2rem; border-top:1px solid var(--stone);
  }
  .btn {
    appearance:none; cursor:pointer; font-family:var(--sans); font-size:.9rem; font-weight:500;
    border-radius:6px; padding:.75rem 1.75rem; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); transition:background .2s, color .2s, opacity .2s;
  }
  .btn:hover { background:#2a2825; }
  .btn-ghost { background:transparent; color:var(--ink); border-color:var(--stone); }
  .btn-ghost:hover { background:transparent; border-color:var(--ink); }
  .btn-accent { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-accent:hover { background:#c72d16; }
  .btn:disabled { opacity:.3; cursor:not-allowed; }
  .nav .count { font-family:var(--mono); font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); }

  /* ---- review ---- */
  .summary { max-width:760px; margin:0 auto; }
  .srow {
    display:grid; grid-template-columns:150px 1fr auto; gap:1rem; align-items:baseline;
    padding:.7rem 0; border-bottom:1px solid var(--stone);
  }
  .srow dt { font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
  .srow dd { margin:0; color:var(--body); font-size:.9rem; }
  .srow dd em { color:var(--dim); font-style:normal; }
  .srow button {
    appearance:none; background:transparent; border:0; cursor:pointer; padding:0;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  }
  .srow button:hover { text-decoration:underline; }
  .shotblock { margin-top:2.5rem; }
  .shotblock > h3 {
    font-family:var(--mono); font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    color:var(--ink); padding-bottom:.5rem; border-bottom:2px solid var(--ink);
  }

  /* ---- prompt block ---- */
  .promptwrap { max-width:760px; margin:2.5rem auto 0; padding-top:2rem; border-top:1px solid var(--stone); }
  .prompt-head { display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; }
  .prompt-head h3 {
    font-family:var(--mono); font-size:.7rem; font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; margin-right:auto;
  }
  .seg { display:flex; border:1px solid var(--stone); border-radius:6px; overflow:hidden; }
  .seg > button {
    appearance:none; border:0; border-right:1px solid var(--stone); cursor:pointer; background:#fff;
    color:var(--steel); font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.45rem .8rem; transition:background .2s, color .2s;
  }
  .seg > button:last-child { border-right:0; }
  .seg > button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  #output {
    width:100%; min-height:22rem; background:var(--ink); color:#c8c4be; border:0; border-radius:6px;
    padding:1.5rem; font-family:var(--mono); font-size:.8rem; line-height:1.8; white-space:pre-wrap; resize:vertical;
  }
  #output:focus { outline:none; }
  .meter {
    display:flex; gap:1.5rem; margin-top:.75rem; font-family:var(--mono);
    font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  }
  .meter b { color:var(--steel); font-weight:700; }
  .meter .warn { color:var(--accent); }

  @media (max-width:640px) {
    .container { padding:0 1.25rem; }
    .rail { gap:0 .9rem; }
    .srow { grid-template-columns:1fr; gap:.2rem; }
    .shottabs { flex-direction:column; align-items:stretch; width:100%; }
    .stab { border-right:0; border-bottom:1px solid var(--stone); }
    .applyall { border-left:0; border-bottom:0; }
  }
</style>
</head>

/* An image's measurable qualities are read off its pixels on upload — palette,
 * tone, contrast, saturation and warmth. Those are the details a browser can
 * genuinely extract on its own; what the thing *is* still has to be named,
 * which is the one field left to fill in. */

const TONE = [[.28,"low-key"],[.62,"mid-key"],[1,"high-key"]];
const CONTRAST = [[.14,"flat"],[.26,"even"],[1,"high-contrast"]];
const SAT = [[.10,"near-monochrome"],[.30,"muted"],[.55,"balanced"],[1,"saturated"]];
const band = (v, table) => (table.find(t => v <= t[0]) || table[table.length - 1])[1];

/** Read palette and tone straight off the pixels. Runs once per upload. */
function analyseImage(url) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const W = 64, H = Math.max(1, Math.round(W * img.height / img.width));
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d", { willReadFrequently:true });
      ctx.drawImage(img, 0, 0, W, H);
      let px;
      try { px = ctx.getImageData(0, 0, W, H).data; }
      catch { return res(null); }

      let n = 0, sumL = 0, sumL2 = 0, sumS = 0, sumR = 0, sumB = 0;
      const bins = new Map();
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] < 128) continue;                 // skip transparent
        const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const l = (mx + mn) / 2;
        n++; sumL += l; sumL2 += l * l; sumR += r; sumB += b;
        sumS += mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1) || 1);
        // 4 bits per channel is coarse enough to cluster a palette
        const k = ((px[i] >> 4) << 8) | ((px[i + 1] >> 4) << 4) | (px[i + 2] >> 4);
        bins.set(k, (bins.get(k) || 0) + 1);
      }
      if (!n) return res(null);

      const L = sumL / n;
      const sd = Math.sqrt(Math.max(0, sumL2 / n - L * L));
      const S = Math.min(1, sumS / n);
      const warmth = (sumR - sumB) / n;
      const swatches = [...bins.entries()].sort((x, y) => y[1] - x[1]).slice(0, 5)
        .map(([k]) => "#" + [(k >> 8) & 15, (k >> 4) & 15, k & 15]
          .map(v => ((v * 17) | 0).toString(16).padStart(2, "0")).join(""));

      res({
        tone: band(L, TONE),
        contrast: band(sd, CONTRAST),
        sat: band(S, SAT),
        temp: warmth > .045 ? "warm" : warmth < -.045 ? "cool" : "neutral",
        swatches,
      });
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

/** The visual qualities, as prose. */
function autoPhrase(a) {
  if (!a) return "";
  const sat = a.sat === "balanced" ? null : a.sat;
  return [a.temp === "neutral" ? null : a.temp, a.tone, a.contrast, sat]
    .filter(Boolean).join(", ");
}

/**
 * The prose a reference contributes. No leading article — the subject is a
 * proper noun or a name the user typed, so it reads as given.
 */
function describeRef(r) {
  const subject = (r.subject || "").trim();
  const auto = autoPhrase(r.auto);
  if (subject && auto) return `${subject} — ${auto}`;
  if (subject) return subject;
  if (auto) return auto;
  return (REF_CATS.find(c => c[0] === r.cat) || [, "reference"])[1].toLowerCase() + " reference";
}

/** Scale beat duration hints so the expanded list fits the runtime cap. */
function fitDurations(hints) {
  let d = hints.map(h => Math.max(MIN_SHOT, Math.round(h || MIN_SHOT)));
  // With a 1s floor the cap also caps the shot count.
  d = d.slice(0, Math.min(MAX_SHOTS, MAX_TOTAL));
  let total = d.reduce((a, b) => a + b, 0);
  if (total > MAX_TOTAL) {
    const k = MAX_TOTAL / total;
    d = d.map(x => Math.max(MIN_SHOT, Math.round(x * k)));
    total = d.reduce((a, b) => a + b, 0);
    let guard = 200;
    while (total > MAX_TOTAL && guard--) {
      let bi = 0;
      d.forEach((x, i) => { if (x > d[bi]) bi = i; });
      if (d[bi] <= MIN_SHOT) break;
      d[bi]--; total--;
    }
  }
  return d;
}

/** Expand a recipe against the current references into concrete shots. */
function expandPreset(p) {
  const beats = [];
  for (const b of p.recipe) {
    if (b.role !== "per") { beats.push({ beat:b, ref:null }); continue; }
    const matches = state.refs.filter(r => r.cat === b.cat);
    // With nothing uploaded a `per` beat still fires once, on its fallbacks.
    if (!matches.length) beats.push({ beat:b, ref:null });
    else for (const r of matches) beats.push({ beat:b, ref:r });
  }
  const durs = fitDurations(beats.map(x => x.beat.dur));
  const shots = beats.slice(0, durs.length).map(({ beat, ref }, i) =>
    Object.assign(newShot(durs[i]), beat, {
      // After the spread, or the beat's hint would overwrite the fitted value.
      dur: durs[i],
      motion: beat.motion ? [...beat.motion] : [],
      scene: fillRefs(beat.scene, ref),
      action: fillRefs(beat.action, ref),
      transOut: null,
    }));
  for (const s of shots) { delete s.role; delete s.cat; }
  if (shots.length) shots[shots.length - 1].transOut = p.endWith || null;
  return shots;
}

/* ===========================================================================

 * ======================================================================== */

const N = n => (Math.round(n * 100) / 100).toString();
const FRONT = "#5c5c66", TOP = "#7b7b86", SIDE = "#3e3e47";

/**
 * Product-proxy block. `top` is signed: positive shows the top face (camera
 * above), negative shows the underside (camera below). `side` is the yaw.
 */
function box(o) {
  const cx = o.cx ?? 50, cy = o.cy ?? 56, s = o.s ?? 32;
  const top = o.top ?? .38, side = o.side ?? .45;
  const front = o.front ?? FRONT, tp = o.top_ ?? TOP, sd = o.side_ ?? SIDE;
  const st = o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1.2}"` : "";
  const x0 = cx - s / 2, y0 = cy - s / 2;
  const dx = s * .38 * side, dy = s * .38 * top;
  let out = "";
  if (Math.abs(dy) > .4)
    out += `<path d="M${N(x0)} ${N(top > 0 ? y0 : y0 + s)}L${N(x0 + dx)} ${N((top > 0 ? y0 : y0 + s) - dy)}L${N(x0 + s + dx)} ${N((top > 0 ? y0 : y0 + s) - dy)}L${N(x0 + s)} ${N(top > 0 ? y0 : y0 + s)}Z" fill="${tp}"${st}/>`;
  if (Math.abs(dx) > .4)
    out += `<path d="M${N(x0 + s)} ${N(y0)}L${N(x0 + s + dx)} ${N(y0 - dy)}L${N(x0 + s + dx)} ${N(y0 + s - dy)}L${N(x0 + s)} ${N(y0 + s)}Z" fill="${sd}"${st}/>`;
  out += `<rect x="${N(x0)}" y="${N(y0)}" width="${N(s)}" height="${N(s)}" rx="${N(Math.min(2, s / 14))}" fill="${front}"${st}/>`;
  // Large faces read as blank fill without a seam and specular band to catch.
  if (o.detail) out +=
    `<path d="M${N(x0)} ${N(y0 + s * .62)}h${N(s)}" stroke="#000" stroke-width="${N(s * .012)}" opacity=".35"/>` +
    `<rect x="${N(x0 + s * .12)}" y="${N(y0)}" width="${N(s * .07)}" height="${N(s)}" fill="#fff" opacity=".1"/>` +
    `<circle cx="${N(x0 + s * .78)}" cy="${N(y0 + s * .34)}" r="${N(s * .055)}" fill="#000" opacity=".3"/>`;
  return out;
}

/**
 * Human figure. Cinematic shot sizes are defined by how much of a body is in
 * frame, so the wide→close-up ladder only reads against a person, never a box.
 * `top` is the crown of the head, `h` the full standing height — both may sit
 * outside the frame for tighter sizes.
 */
function figure(o = {}) {
  const cx = o.cx ?? 50, top = o.top ?? 18, h = o.h ?? 60;
  const c = o.fill ?? "#74747f", c2 = o.shade ?? "#50505a";
  const u = h / 7.5;                       // one head-height unit
  const hr = u * .46, sh = top + u * 1.15, hip = top + u * 3.95, foot = top + h;
  const sw = u * .95, hw = u * .6;
  return (
    `<path d="M${N(cx - hw)} ${N(hip)}L${N(cx - hw * .95)} ${N(foot)}L${N(cx - hw * .15)} ${N(foot)}L${N(cx - u * .08)} ${N(hip)}Z" fill="${c2}"/>` +
    `<path d="M${N(cx + hw)} ${N(hip)}L${N(cx + hw * .95)} ${N(foot)}L${N(cx + hw * .15)} ${N(foot)}L${N(cx + u * .08)} ${N(hip)}Z" fill="${c}"/>` +
    `<path d="M${N(cx - sw)} ${N(sh)}Q${N(cx)} ${N(sh - u * .3)} ${N(cx + sw)} ${N(sh)}L${N(cx + hw)} ${N(hip + u * .2)}L${N(cx - hw)} ${N(hip + u * .2)}Z" fill="${c}"/>` +
    `<path d="M${N(cx - sw)} ${N(sh)}L${N(cx - sw - u * .3)} ${N(sh + u * .35)}L${N(cx - sw - u * .05)} ${N(hip + u * .1)}L${N(cx - sw + u * .32)} ${N(hip)}Z" fill="${c2}"/>` +
    `<path d="M${N(cx + sw)} ${N(sh)}L${N(cx + sw + u * .3)} ${N(sh + u * .35)}L${N(cx + sw + u * .05)} ${N(hip + u * .1)}L${N(cx + sw - u * .32)} ${N(hip)}Z" fill="${c2}"/>` +
    `<rect x="${N(cx - u * .16)}" y="${N(sh - u * .55)}" width="${N(u * .32)}" height="${N(u * .7)}" fill="${c2}"/>` +
    `<ellipse cx="${N(cx)}" cy="${N(top + hr)}" rx="${N(hr * .84)}" ry="${N(hr)}" fill="${c}"/>` +
    // Once the head is large enough to hold them, features make a close-up
    // read as a person rather than an oval.
    (hr < 11 ? "" :
      `<ellipse cx="${N(cx - hr * .32)}" cy="${N(top + hr * .92)}" rx="${N(hr * .11)}" ry="${N(hr * .14)}" fill="#26262c"/>` +
      `<ellipse cx="${N(cx + hr * .32)}" cy="${N(top + hr * .92)}" rx="${N(hr * .11)}" ry="${N(hr * .14)}" fill="#26262c"/>` +
      `<path d="M${N(cx - hr * .26)} ${N(top + hr * 1.42)}q${N(hr * .26)} ${N(hr * .2)} ${N(hr * .52)} 0" ` +
      `stroke="${c2}" stroke-width="${N(hr * .1)}" fill="none" stroke-linecap="round"/>`)
  );
}

/** Face filling the frame — what an extreme close-up actually means. */
const face = () =>
  `<ellipse cx="50" cy="60" rx="42" ry="52" fill="#74747f"/>` +
  `<ellipse cx="34" cy="50" rx="6.5" ry="4.2" fill="#26262c"/>` +
  `<ellipse cx="66" cy="50" rx="6.5" ry="4.2" fill="#26262c"/>` +
  `<path d="M25 40q9-5 18-1M75 40q-9-5-18-1" stroke="#50505a" stroke-width="3" fill="none" stroke-linecap="round"/>` +
  `<path d="M50 56v12q0 3 4 3" stroke="#50505a" stroke-width="2.6" fill="none" stroke-linecap="round"/>` +
  `<path d="M39 84q11 7 22 0" stroke="#50505a" stroke-width="3" fill="none" stroke-linecap="round"/>`;

// Backdrops overhang the 100×100 frame so translating camera moves never slide
// bare canvas into view; the frame's overflow:hidden crops the excess.
const OV = -40, OW = 180;
const bg = (id = "bgN") => `<rect x="${OV}" y="${OV}" width="${OW}" height="${OW}" fill="url(#${id})"/>`;
const ground = (y = 72, c = "#111114") => `<rect x="${OV}" y="${y}" width="${OW}" height="${N(140 - y)}" fill="${c}"/><rect x="${OV}" y="${N(y - .6)}" width="${OW}" height=".6" fill="#4c4c56" opacity=".8"/>`;
const shadow = (cx = 50, cy = 73, rx = 22, ry = 4, op = .45) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity="${op}"/>`;
const glow = (cx, cy, r, id = "gW", op = 1) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" opacity="${op}"/>`;

/** Standard staged scene used as the backdrop for most previews. */
function stage(o = {}) {
  return bg(o.bgId) + ground(o.gy ?? 72, o.gc) + shadow(o.sx, o.sy, o.srx, o.sry, o.sop) + box(o.box || {});
}
/** Wrap markup in an animated group. `a` is a keyframe name; `extra` appends
 *  declarations to the SAME style attribute — a second one would be dropped. */
function anim(inner, a, dur, dir, ease, extra) {
  const v = [`--a:${a}`];
  if (dur) v.push(`--ad:${dur}`);
  if (dir) v.push(`--adir:${dir}`);
  if (ease) v.push(`--ae:${ease}`);
  if (extra) v.push(extra);
  return `<g class="anim" style="${v.join(";")}">${inner}</g>`;
}
const svg = inner => `<svg class="pv" viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;

const P = {};

/** Two-shot transition preview: outgoing scene A, incoming scene B, plus overlay. */
function transition(id, dir) {
  const A = bg("bgLow") + ground(74, "#0b0b0e") + shadow(50, 75, 20, 3.5, .5) + box({ cy:58, s:26, top:.3, side:.4, front:"#3b3b43", top_:"#51515a", side_:"#2a2a30" });
  // Incoming scene is lit brighter than the default stage so a black ramp
  // laid over it still reads as a gradient rather than a flat black card.
  const B = bg() + ground(74) + glow(32, 20, 46, "gW", .38) + shadow(50, 75, 22, 4, .35) +
    box({ front:"#74747e", top_:"#9a9aa4", side_:"#4e4e57" });
  const out = dir === "out";
  // Fades pair a static left-to-right ramp (so a paused card still reads as
  // "from black" vs "to black") with a solid overlay that animates from
  // transparent — parking the animation at 0 keeps the scene visible.
  const ramp = g => `<rect width="100" height="100" fill="url(#${g})"/>`;
  const veil = c => anim(`<rect x="${OV}" y="${OV}" width="${OW}" height="${OW}" fill="${c}"/>`, "sharpen", "2.4s");
  switch (id) {
    case "cut": return svg(A + anim(B, out ? "soften" : "sharpen", "1.6s", "alternate", "steps(1,end)") +
      `<path d="M50 0v100" stroke="#e6e6ea" stroke-width="1.4" opacity=".8"/>`);
    case "fade-black": return svg(B + ramp(out ? "fToB" : "fFromB") + veil("#000"));
    case "fade-white": return svg(B + ramp(out ? "fToW" : "fFromW") + veil("#fff"));
    case "dissolve": return svg(A + anim(B, "mix", "2.6s"));
    case "whip": return svg(A + anim(B, out ? "slideOut" : "slideIn", "1.8s", "alternate", "cubic-bezier(.7,0,.3,1)") +
      `<path d="M4 26h30M4 50h44M4 74h30" stroke="#9a9aa6" stroke-width="1" opacity=".45"/>`);
    case "match": return svg(bg() + ground(74) + shadow(50, 75, 20, 4) +
      anim(`<circle cx="50" cy="52" r="19" fill="${FRONT}"/>`, out ? "mix" : "soften", "2.4s") +
      anim(box({ cy:52, s:34, top:.3, side:.4 }), out ? "soften" : "mix", "2.4s"));
    case "bloom": return svg(B + anim(glow(50, 46, 62, "gW", 1), "bloom", "2.4s"));
    default: return svg(B + `<rect x="40" y="40" width="7" height="22" rx="2" fill="#e6e6ea"/><rect x="53" y="40" width="7" height="22" rx="2" fill="#e6e6ea"/>`);
  }
}
