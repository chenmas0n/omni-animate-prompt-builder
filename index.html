 * Vision calls. A free-tier Gemini key ships in the file just below, so the
 * tool reads your images with nothing to set up; a visitor can still paste
 * their own key to spend their own quota instead, and a typed key always wins.
 *
 * Which providers can be called straight from a page like this is decided by
 * CORS, and it was measured, not assumed — from both file:// and
 * http://localhost, with dummy keys:
 *
 *   Anthropic  readable 401   (needs the anthropic-dangerous-direct-browser
 *                              -access header, else blocked)
 *   Gemini     readable 400   (key goes in the query string)
 *   OpenAI     blocked        (no CORS headers at all, from any origin —
 *                              a ChatGPT key needs a proxy server, so it
 *                              isn't offered here)
 *
 * A typed key lives in this browser's localStorage, one per provider. Images
 * leave the browser at two moments only: when Describe is pressed, and when a
 * preset is picked and the model writes the shot list from them.
 * ------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
 * The bundled key, stored encoded rather than as plain text.
 *
 * WHY: a literal "AIzaSy…" in a public repository is found by automated
 * scanners within minutes. The first key shipped here was reported to Google
 * and disabled inside half an hour — the API answers every request with
 * "Your API key was reported as leaked" and there is no way to re-enable it.
 * Encoding breaks the pattern those scanners match on, which is what keeps a
 * bundled key alive.
 *
 * WHAT THIS IS NOT: security. The decoder is three lines below the data, so
 * anyone who opens devtools can recover the key in seconds. It buys exactly
 * one thing — surviving the automated sweep.
 *
 * So the real protection is that the key is worth almost nothing to steal:
 *
 *   1. NO BILLING ACCOUNT on its project. Worst case is an exhausted free
 *      quota, never a charge. This is the one that matters — keep it true.
 *   2. Rotate it the moment the quota looks wrong. One button, and nothing
 *      here depends on which key it is.
 *
 * An origin restriction would be the obvious third control, and it is not
 * available: Google now requires Gemini API keys to be bound to a service
 * account, and service-account-bound keys reject Website/IP restrictions
 * ("This option is not available for API keys authenticated through a service
 * account"). Nothing to configure — the option simply isn't offered.
 *
 * TO REPLACE IT: mint a key at aistudio.google.com/apikey on a project with
 * no billing, then encode it — paste this into any browser console, no
 * install:
 *
 *   (k => btoa([...k].map((c, i) =>
 *     String.fromCharCode(c.charCodeAt(0) ^ "omni-animate".charCodeAt(i % 12))
 *   ).join("")))("AIzaSy…your key here…")
 *
 * and put the resulting string in GEMINI_KEY_BLOB. Leave the blob empty and
 * the app asks each visitor for their own key instead — the tool still works,
 * it just stops being zero-setup.
 * ------------------------------------------------------------------------- */
const KEY_SALT = "omni-animate";
const GEMINI_KEY_BLOB = "LjxAKE9ZPCdbLTACGyMgXUoEVjAbJSZVBBwqKnsuNhEHVjxILigGBH5ZFDg3WERSKjUmXmw=";
const CLAUDE_KEY_BLOB = "";

/** Undo the encoding above. Returns "" for an empty, malformed or implausible
 *  blob, which reads to the rest of the app as "no bundled key" — the panel
 *  then asks for one, instead of sending Google a string of mojibake and
 *  surfacing a puzzling error. */
function decodeKey(blob) {
  if (!blob) return "";
  let raw = "";
  try { raw = atob(blob); } catch { return ""; }
  let out = "";
  for (let i = 0; i < raw.length; i++)
    out += String.fromCharCode(raw.charCodeAt(i) ^ KEY_SALT.charCodeAt(i % KEY_SALT.length));
  // A key is printable ASCII of a sane length; anything else is a bad blob.
  return out.length >= 20 && out.length <= 200 && /^[\x21-\x7e]+$/.test(out) ? out : "";
}

const DEFAULT_GEMINI_KEY = decodeKey(GEMINI_KEY_BLOB);
const DEFAULT_CLAUDE_KEY = decodeKey(CLAUDE_KEY_BLOB);

const PROVIDERS = {
  gemini: {
    label: "Gemini",
    hint: "get one free at <b>aistudio.google.com/apikey</b> &mdash; no billing setup needed",
    placeholder: "AIza…",
    ls: "omni-animate-gemini-key",
    fallback: () => DEFAULT_GEMINI_KEY,
    /* Flash-Lite is the cheap fast one, and its free tier is the most generous
     * of the family. Google retires pinned versions out from under you — 2.5
     * Flash-Lite and 2.0 Flash both 404 for new keys now, each with a "use the
     * newer one" message — so the pinned current id is tried first and the
     * rolling alias sits behind it, which keeps working across the next
     * retirement without an edit here. */
    models: ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-3.1-flash-lite"],
    request(model, key, images, prompt, maxTokens, temp) {
      return {
        url: `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
        init: {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [
              ...images.map(im => ({ inline_data:{ mime_type:im.media, data:im.b64 } })),
              { text:prompt },
            ]}],
            generationConfig: { temperature:temp, maxOutputTokens:maxTokens, responseMimeType:"application/json" },
          }),
        },
      };
    },
    text: j => ((((j.candidates || [])[0] || {}).content || {}).parts || [])
      .map(p => p.text || "").join(""),
    /* Google's own wording is more use than a guess, so anything unrecognised
     * passes through rather than being flattened into a plausible-sounding
     * cause. The leaked-key case gets its own line because it is terminal —
     * no amount of retrying revives a key Google has disabled. */
    error: (status, msg) =>
      /reported as leaked/i.test(msg)
        ? "This tool's built-in key was disabled by Google for being published, so it needs replacing. " +
          "Until then, scene reading is off — the presets still write your shot list."
      : /referer|referrer|not authorized|API_KEY_HTTP_REFERRER/i.test(msg)
        ? "The built-in key doesn't allow this site. Its referrer restriction needs to include this page's address."
      : status === 400 && /API key not valid/i.test(msg) ? "Key rejected. Check it and save again."
      : status === 429 ? "Rate limited — wait a moment and retry."
      : status === 403 ? `Key refused by Google${msg ? ": " + msg.slice(0, 130) : "."}`
      : "",
  },
  claude: {
    label: "Claude",
    // Worth spelling out: a Claude.ai Pro/Team seat is a different product and
    // grants no API key. People reasonably assume it does.
    hint: "needs a paid <b>console.anthropic.com</b> API key &mdash; a Claude.ai Pro or Team " +
          "subscription is a separate product and does not include one",
    placeholder: "sk-ant-…",
    ls: "omni-animate-claude-key",
    fallback: () => DEFAULT_CLAUDE_KEY,
    models: ["claude-haiku-4-5-20251001"],
    request(model, key, images, prompt, maxTokens, temp) {
      return {
        url: "https://api.anthropic.com/v1/messages",
        init: {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            // Without this header the browser blocks the request.
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model, max_tokens: maxTokens, temperature: temp,
            messages: [{ role:"user", content:[
              ...images.map(im => ({ type:"image", source:{ type:"base64", media_type:im.media, data:im.b64 } })),
              { type:"text", text:prompt },
            ]}],
          }),
        },
      };
    },
    text: j => (j.content || []).filter(c => c.type === "text").map(c => c.text).join(""),
    error: status =>
      status === 401 ? "Key rejected. Check it and save again." :
      status === 429 ? "Rate limited — wait a moment and retry." : "",
  },
};

const VISION_PROMPT =
  "Identify what is in this reference image, for use in a video-generation prompt. " +
  "Reply with nothing but JSON in this exact shape:\n" +
  '{"subject":"...","elements":["..."],"detail":"..."}\n' +
  "subject: 2-6 words naming the main thing, no leading article, no punctuation. " +
  'Use words a director would use ("orc warchief in iron plate", "matte-black cordless drill").\n' +
  "elements: 3 to 6 short phrases, each 1-4 words, listing the distinct things actually visible " +
  "in the scene — objects, surroundings, notable materials or props. No duplicates of subject.\n" +
  "detail: one sentence, 25 words maximum, on materials, palette and mood. " +
  "Describe only what is visible; never mention that this is an image or a render.";

const vision = { status:"idle", note:"", done:0, of:0, provider:"gemini" };

const provider = () => PROVIDERS[vision.provider];

/** True when a key ships in the file for this provider. Then it is *the* key:
 *  it outranks anything in localStorage and there is no key UI at all. The
 *  panel only asks for one when the constant was left blank. */
const builtIn = (pid = vision.provider) => (PROVIDERS[pid].fallback() || "").trim();
const usingBuiltIn = (pid = vision.provider) => builtIn(pid).length > 0;

/* A key stored by an earlier visit would otherwise shadow the built-in one
 * forever — the browser that typed it keeps being asked for it long after the
 * file started shipping its own. Clear those once, on load. */
(function dropStaleKeys() {
  for (const pid of Object.keys(PROVIDERS)) {
    if (!usingBuiltIn(pid)) continue;
    try { localStorage.removeItem(PROVIDERS[pid].ls); } catch { /* private browsing */ }
  }
})();

const getKey = (pid = vision.provider) => {
  const p = PROVIDERS[pid];
  if (usingBuiltIn(pid)) return builtIn(pid);
  try { return localStorage.getItem(p.ls) || ""; }
  catch { return ""; }
};
const setKey = (k, pid = vision.provider) => {
  try {
    const p = PROVIDERS[pid];
    k ? localStorage.setItem(p.ls, k) : localStorage.removeItem(p.ls);
  } catch { /* private browsing */ }
};
const hasKey = (pid = vision.provider) => getKey(pid).trim().length > 0;

/** Split a data: URL into media type and base64 payload. */
function dataUrlParts(url) {
  const m = /^data:([^;,]+);base64,(.*)$/.exec(String(url || ""));
  if (!m) return null;
  const ok = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  return { media: ok.includes(m[1]) ? m[1] : "image/jpeg", b64: m[2] };
}

/** Pull a JSON object out of a reply that may carry prose around it. */
function parseReply(text) {
  const s = String(text || "");
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch { return null; }
}

/**
 * One JSON call to the current provider, with N images attached. Returns the
 * parsed object or null, leaving the reason in `vision.note` either way.
 * Both jobs — captioning one image and directing a whole shot list — are the
 * same round trip, so the transport, the model retry and the error wording
 * live here once.
 */
async function callVision(images, prompt, maxTokens = 400, temp = 0.2) {
  const P = provider();
  if (!hasKey()) { vision.note = `Add a ${P.label} API key first.`; return null; }
  if (!images.length) { vision.note = "No readable images to send."; return null; }
  const key = getKey().trim();

  let lastNote = "";
  for (const model of P.models) {
    const { url:endpoint, init } = P.request(model, key, images, prompt, maxTokens, temp);
    let r;
    try { r = await fetch(endpoint, init); }
    catch { vision.note = "Couldn't reach the API — check your connection."; return null; }

    if (!r.ok) {
      let msg = "";
      try { msg = (((await r.json()).error) || {}).message || ""; } catch { /* non-JSON */ }
      // An unknown model id is worth retrying on the next candidate; anything
      // else is a real failure and shouldn't burn another call.
      if (r.status === 404 || /not found|not supported|unsupported/i.test(msg)) {
        lastNote = `${model} unavailable on this key`;
        continue;
      }
      vision.note = P.error(r.status, msg) || `API error ${r.status}${msg ? ": " + msg.slice(0, 90) : ""}`;
      return null;
    }
    let j;
    try { j = await r.json(); } catch { vision.note = "Unreadable reply from the API."; return null; }
    const got = parseReply(P.text(j));
    if (!got) { vision.note = "The model didn't return usable JSON."; return null; }
    vision.note = "";
    return got;
  }
  vision.note = lastNote || "No usable model for this key.";
  return null;
}

/** Describe one image. Returns {subject, elements, detail} or null. */
async function captionImage(url) {
  const parts = dataUrlParts(url);
  if (!parts) { vision.note = "That image couldn't be read."; return null; }
  const got = await callVision([parts], VISION_PROMPT);
  if (!got) return null;
  if (!got.subject) { vision.note = "The model didn't return a usable description."; return null; }
  return {
    subject: tidySubject(got.subject),
    elements: tidyElements(got.elements),
    detail: tidyDetail(got.detail),
  };
}

/** Guards, in case a model slips in an article or a preamble anyway. */
function tidySubject(s) {
  return String(s || "").trim().replace(/\s+/g, " ").replace(/[.!]+$/, "")
    .replace(/^(an?|the)\s+/i, "")
    .replace(/^(image|photo|picture|photograph|rendering|render)\s+of\s+(an?|the)?\s*/i, "")
    .slice(0, 70);
}
function tidyDetail(s) {
  return String(s || "").trim().replace(/\s+/g, " ")
    .replace(/^(the image (shows|is|depicts)|in this image (we can see|there is)|this image (shows|is))\s+/i, "")
    .replace(/^./, c => c.toUpperCase())
    .slice(0, 240);
}
function tidyElements(a) {
  return (Array.isArray(a) ? a : [])
    .map(x => String(x || "").trim().replace(/\s+/g, " ").replace(/[.,;]+$/, "").replace(/^(an?|the)\s+/i, ""))
    .filter(x => x && x.length <= 40)
    .slice(0, 6);
}

/* ===========================================================================
 * 4. State
 * ======================================================================== */

const newShot = dur => ({ dur, scene:"", action:"", framing:null, angle:null, lens:null, dof:null,
  motion:[], speed:null, light:null, temp:null, transIn:null, transOut:null });

const state = {
  step: 0, activeShot: 0, format: "prose", visited: new Set([0]),
  expanded: new Set(), preset: null, openField: null, openGroups: new Set(),
  refs: [], selectedShot: 0,
  style: null, cadence: null, atmos: [],
  shots: [newShot(5)],
};

/**
 * Resolve `{category|fallback}` tokens against uploaded references. A matching
 * upload becomes its own note plus "(ref N)" so the model binds the words to
 * the image; with nothing uploaded the generic fallback keeps the line
 * readable.
 */
/** Inline citation: the name and the ref number only. The extracted palette
 *  and tone belong in the References block, not wedged mid-sentence. */
function refPhrase(r) {
  const name = (r.subject || "").trim() ||
    (REF_CATS.find(c => c[0] === r.cat) || [, "reference"])[1].toLowerCase();
  return `${name} (ref ${state.refs.indexOf(r) + 1})`;
}

/**
 * Resolve reference tokens. `{this}` is the reference the current beat is
 * expanding for; `{category|fallback}` takes the first reference of that
 * category, or the fallback wording when none was uploaded.
 */
function fillRefs(text, thisRef) {
  return String(text || "")
    .replace(/\{this\}/g, () => thisRef ? refPhrase(thisRef) : "the subject")
    .replace(/\{(\w+)\|([^}]*)\}/g, (_, cat, fallback) => {
      const r = state.refs.find(x => x.cat === cat);
      return r ? refPhrase(r) : fallback;
    });
}

/** Fill the whole wizard from a preset — settings and written text alike. */
function applyPreset(p) {
  state.preset = p.id;
  state.style = p.style; state.cadence = p.cadence; state.atmos = [...p.atmos];
  state.shots = expandPreset(p);
  state.activeShot = 0;
  state.openField = null;
  rebalance();
}

const allItems = f => f.groups ? f.groups.flatMap(g => g.items) : f.items;
const item = (fieldId, id) => allItems(FIELD[fieldId]).find(i => i[0] === id);

/* ---- AI direction -------------------------------------------------------
 * A preset knows the shape of a sequence but not what you uploaded. With a
 * key, picking one sends every reference in a single call and the model writes
 * the shot list against those particular images — naming subjects, choosing
 * framing and light, pacing the beats. Without a key, or if the call fails,
 * the preset expands on its own exactly as it always did.
 */

/** Every per-shot field the model is allowed to set, and its legal ids. */
const DIRECTABLE = ["framing","angle","lens","dof","motion","speed","light","temp","transIn","transOut"];
const fieldIds = id => allItems(FIELD[id]).map(i => i[0]);

/**
 * Coerce a model-supplied value to a legal id for that field, or null.
 * Two coercions are deliberate, because both are ordinary ways for a model to
 * name a value it got right: a JSON number for the numeric ids (lens "85"),
 * and a single-element array where a bare string was asked for. Anything else
 * that isn't an exact id is dropped, and the preset's own value stands.
 */
function legalId(fieldId, v) {
  const one = Array.isArray(v) ? (v.length === 1 ? v[0] : null) : v;
  if (one == null || typeof one === "object") return null;
  const s = String(one).trim();
  return fieldIds(fieldId).includes(s) ? s : null;
}

/** The instruction sent with the images: what to build, and the exact
 *  vocabulary it may use for every settings field. */
function directorPrompt(p) {
  const refLines = state.refs.map((r, i) => {
    const cat = (REF_CATS.find(c => c[0] === r.cat) || [, "reference"])[1];
    const named = r.subject ? `, which the user named "${r.subject}"` : "";
    const reads = r.auto ? `, reading as ${autoPhrase(r.auto)}` : "";
    return `Image ${i + 1} — tagged "${cat}"${named}${reads}.`;
  }).join("\n");

  const beats = p.recipe.map((b, i) =>
    `${i + 1}. ${b.role === "per" ? `one beat for every "${b.cat}" reference` : "once"}` +
    `${b.dur ? `, about ${b.dur}s` : ""} — ${b.scene || "open beat, wording is yours to choose"}`).join("\n");

  return [
    "You are directing a short image-to-video sequence. The reference images are attached in order, " +
    "and a preset below describes the intended shape of the piece. Write the shot list.",
    "",
    `PRESET: ${p.name} — ${p.sum}`,
    "Its intended beats:",
    beats,
    "",
    state.refs.length
      ? `THE ATTACHED REFERENCES, in order:\n${refLines}`
      : "No references were uploaded. Write the sequence from the preset alone.",
    "",
    `CONSTRAINTS: between 2 and ${MAX_SHOTS} shots. Every duration is a whole number of seconds, ` +
    `at least ${MIN_SHOT}, and they must add up to ${MAX_TOTAL} or less.`,
    "",
    "Reply with nothing but JSON in this exact shape:",
    '{"refs":[{"subject":"...","elements":["..."],"detail":"..."}],' +
    '"shots":[{"dur":4,"scene":"...","action":"...","framing":"ws","angle":"low","lens":"35",' +
    '"dof":"deep","motion":["dolly-in"],"speed":"slow","light":"rim","temp":"cool",' +
    '"transIn":"fade-black","transOut":"cut"}]}',
    "",
    "refs: one entry per attached image, in the same order, even if you were given a name already. " +
    "subject is 2-6 words naming the main thing, no leading article. elements is 3-6 short phrases " +
    "listing what is actually visible. detail is one sentence, 25 words maximum, on materials, " +
    "palette and mood. Describe only what you can see; never mention that this is an image or a render.",
    "",
    "shots: the sequence itself. `scene` says what is in frame — refer to the reference subjects in " +
    'the words you gave them, and write "(ref N)" directly after a subject drawn from image N so the ' +
    "video model binds the words to that image. `action` is one clause on what moves during the shot. " +
    "Follow the preset's intent, but write for these particular references rather than a generic version.",
    "",
    "Every field below must be one of its listed ids, spelled exactly, or left out. " +
    `motion is an array of at most ${FIELD.motion.max} ids.`,
    DIRECTABLE.map(id => `${id}: ${fieldIds(id).join(", ")}`).join("\n"),
  ].join("\n");
}

/**
 * Lay a directed shot list over the preset's own expansion. Anything the model
 * omits — or gets wrong — keeps the preset's crafted value, so a partial or
 * sloppy reply still lands on a usable list instead of a hollow one.
 */
function mergeDirected(p, directed) {
  const base = expandPreset(p);
  if (!Array.isArray(directed) || !directed.length) return base;
  const shots = directed.slice(0, MAX_SHOTS).map((d, i) => {
    // Past the end of the preset's own beats, the last one is the template.
    const b = base[Math.min(i, base.length - 1)] || newShot(3);
    const s = Object.assign(newShot(b.dur), b, { motion:[...(b.motion || [])] });
    if (d && typeof d.scene === "string" && d.scene.trim()) s.scene = d.scene.trim();
    if (d && typeof d.action === "string" && d.action.trim()) s.action = d.action.trim();
    for (const f of DIRECTABLE) {
      if (f === "motion") continue;
      const v = legalId(f, d && d[f]);
      if (v) s[f] = v;
    }
    if (d && Array.isArray(d.motion)) {
      const m = d.motion.map(x => legalId("motion", x)).filter(Boolean).slice(0, FIELD.motion.max);
      if (m.length) s.motion = m;
    }
    const n = Math.round(Number(d && d.dur));
    if (n >= MIN_SHOT && n <= MAX_TOTAL) s.dur = n;
    return s;
  });
  // Only the last shot ends the piece; a stray transOut mid-list reads as one.
  shots.forEach((s, i) => { if (i < shots.length - 1 && s.transOut === "hold") s.transOut = null; });
  return shots;
}

/* Only the newest direction may write to state. Picking a second preset while
 * the first call is still out would otherwise let the slower reply land last
 * and overwrite the list you actually asked for. */
let directRun = 0;

/** Read every reference against the chosen preset and write the shot list.
 *  Returns true if the model's list was used. */
async function directFromPreset(p) {
  const run = ++directRun;
  const images = state.refs.map(r => dataUrlParts(r.url)).filter(Boolean);
  const got = await callVision(images, directorPrompt(p), 4000, 0.4);
  if (run !== directRun) return null;       // superseded while we were waiting
  if (!got) return false;

  // Names first: the shot text cites references by name, and expandPreset's
  // fallbacks read from these too.
  if (Array.isArray(got.refs)) {
    got.refs.slice(0, state.refs.length).forEach((d, i) => {
      const r = state.refs[i];
      if (!r || !d) return;
      if (d.subject) r.subject = tidySubject(d.subject);
      if (d.detail) r.detail = tidyDetail(d.detail);
      if (Array.isArray(d.elements)) r.elements = tidyElements(d.elements);
    });
  }

  if (!Array.isArray(got.shots) || !got.shots.length) {
    vision.note = "The model didn't return a shot list — the preset's own version is below.";
    return false;
  }
  state.shots = mergeDirected(p, got.shots);
  state.activeShot = 0; state.selectedShot = 0; state.openField = null;
  rebalance();
  return true;
}

/** Direct against `p`, showing the wait and whatever came of it. A run that was
 *  superseded by a newer pick returns null and leaves the display to that one. */
async function runDirector(p) {
  vision.status = "directing";
  vision.note = "";
  vision.of = state.refs.length;
  renderStep();
  const ok = await directFromPreset(p);
  if (ok === null) return;                  // a newer run owns the display now
  vision.status = ok ? "idle" : "failed";
  renderStep(); renderRail();
}

/** Whether the model can write the list: it needs a key, something to look at,
 *  and a preset that wants writing at all. */
const canDirect = p => hasKey() && state.refs.length > 0 && !!p && !p.manual;

/** Picking a preset lands you on the shot list. With a key and at least one
 *  reference, the model writes that list first; otherwise the preset expands
 *  on its own and you edit from there. */
async function choosePreset(p) {
  applyPreset(p);
  state.selectedShot = 0;
  goto(STEPS.findIndex(s => s.id === "shots"));
  if (!canDirect(p)) return;
  await runDirector(p);
}
const isShotField = id => SHOT_FIELDS.includes(id);
const shot = () => state.shots[state.activeShot];
const get = id => isShotField(id) ? shot()[id] : state[id];
function put(id, v) { if (isShotField(id)) shot()[id] = v; else state[id] = v; }
const prose = (fieldId, v) => v ? item(fieldId, v)[2] : null;
const totalDur = () => state.shots.reduce((a, s) => a + s.dur, 0);

/** Trim the longest shots until the whole piece fits the runtime cap. */
function rebalance() {
  state.shots.forEach(s => { s.dur = Math.max(MIN_SHOT, Math.min(MAX_TOTAL, Math.round(s.dur) || MIN_SHOT)); });
  let guard = 500;
  while (totalDur() > MAX_TOTAL && guard--) {
    let bi = 0;
    state.shots.forEach((s, i) => { if (s.dur > state.shots[bi].dur) bi = i; });
    if (state.shots[bi].dur <= MIN_SHOT) break;
    state.shots[bi].dur--;
  }
}

/** A step counts as done once it has been visited and holds an answer.
 *  Gating on `visited` stops steps with usable defaults (Basics) from showing
 *  a tick before the user has ever seen them. */
function stepDone(s, i) {
  if (!state.visited.has(i)) return false;
  if (s.id === "refs") return state.refs.length > 0;
  if (s.id === "preset") return state.preset !== null;
  if (s.id === "shots") return state.shots.some(sh => sh.scene.trim() || sh.action.trim());
  return false;
}

/* ===========================================================================
 * 5. Rendering
 * ======================================================================== */

const stageEl = document.getElementById("stage");
const railEl = document.getElementById("rail");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const pad = n => String(n).padStart(2, "0");

function renderRail() {
  railEl.innerHTML = "";
  STEPS.forEach((s, i) => {
    const done = stepDone(s, i);
    const b = el("button", "rstep" + (done ? " done" : ""));
    b.type = "button";
    b.setAttribute("aria-current", String(i === state.step));
    b.innerHTML = `<span class="n">${done && i !== state.step ? "&check;" : pad(i + 1)}</span>${s.name}`;
    b.addEventListener("click", () => goto(i));
    railEl.appendChild(b);
  });
}

function cardGrid(fieldId) {
  const f = FIELD[fieldId];
  const wrap = el("div", "field");
  wrap.innerHTML = `<label>${f.label}${f.max ? ` <span class="optional">(up to ${f.max})</span>` : ""}</label>`;

  const core = CORE[fieldId];
  const open = !core || state.expanded.has(fieldId);
  const cur = get(fieldId);
  const chosen = id => Array.isArray(cur) ? cur.includes(id) : cur === id;
  const visible = id => open || core.includes(id) || chosen(id);
  let hidden = 0;

  for (const g of (f.groups || [{ name:null, items:f.items }])) {
    const items = g.items.filter(([id]) => visible(id));
    hidden += g.items.length - items.length;
    if (!items.length) continue;
    if (g.name) wrap.appendChild(el("span", "grouplabel", g.name));
    const grid = el("div", "cards");
    for (const [id, label] of items) {
      const b = el("button", "card");
      b.type = "button";
      b.dataset.field = fieldId; b.dataset.id = id;
      const cur = get(fieldId);
      const on = Array.isArray(cur) ? cur.includes(id) : cur === id;
      b.setAttribute("aria-pressed", String(on));
      const show = on && Array.isArray(cur) && cur.length > 1;
      b.innerHTML = `<span class="ord${show ? " on" : ""}">${show ? cur.indexOf(id) + 1 : ""}</span>` +
        `<span class="frame">${preview(fieldId, id)}</span><span class="cap">${label}</span>`;
      // Update in place: a full re-render would rebuild every preview SVG and
      // make the step flash. The summary chip above the editor has to be
      // repainted too, or it keeps showing the pre-click value.
      b.addEventListener("click", () => {
        toggle(fieldId, id); refreshCards(fieldId); refreshSetChips();
        refreshPrompt(); if (state.selectedShot != null) refreshTile(state.selectedShot);
        renderRail();
      });
      grid.appendChild(b);
    }
    wrap.appendChild(grid);
  }

  if (core && (hidden || open)) {
    const t = el("button", "more", open ? "Show fewer" : `Show ${hidden} more`);
    t.type = "button";
    t.addEventListener("click", () => {
      state.expanded.has(fieldId) ? state.expanded.delete(fieldId) : state.expanded.add(fieldId);
      renderStep();
    });
    wrap.appendChild(t);
  }
  return wrap;
}

/** Repaint every settings-chip summary from state, without a full re-render. */
function refreshSetChips() {
  for (const b of document.querySelectorAll(".setchip[data-set]")) {
    const [si, f] = b.dataset.set.split(":");
    const v = settingLabel(f, si === "g" ? null : state.shots[Number(si)]);
    b.querySelector(".v").textContent = v || "—";
    b.classList.toggle("unset", !v);
  }
}

/** Repaint one field's selection state without rebuilding the step. */
function refreshCards(fieldId) {
  const cur = get(fieldId);
  for (const b of document.querySelectorAll(`.card[data-field="${fieldId}"]`)) {
    const on = Array.isArray(cur) ? cur.includes(b.dataset.id) : cur === b.dataset.id;
    b.setAttribute("aria-pressed", String(on));
    const ord = b.querySelector(".ord");
    const show = on && Array.isArray(cur) && cur.length > 1;
    ord.textContent = show ? String(cur.indexOf(b.dataset.id) + 1) : "";
    ord.classList.toggle("on", show);
  }
}

/** Clicking a selected card clears it, so any field can be left unanswered. */
function toggle(fieldId, id) {
  const f = FIELD[fieldId];
  if (f.max) {
    const cur = get(fieldId), at = cur.indexOf(id);
    if (at >= 0) cur.splice(at, 1);
    else if (cur.length < f.max) cur.push(id);
    else { cur.shift(); cur.push(id); }
  } else {
    put(fieldId, get(fieldId) === id ? null : id);
  }
}

/* ---- the shot list: every per-shot control on one page ------------------- */

/** Compact summary label for one field's current value on a given shot. */
function settingLabel(fieldId, sh) {
  const v = sh ? sh[fieldId] : state[fieldId];
  if (Array.isArray(v)) return v.length ? v.map(x => item(fieldId, x)[1]).join(" + ") : null;
  return v ? item(fieldId, v)[1] : null;
}

/** Row of setting chips; clicking one opens that field's cards underneath. */
function settingsRow(fields, shotIdx) {
  const key = f => `${shotIdx ?? "g"}:${f}`;
  const wrap = el("div", "settings");
  const row = el("div", "setrow");
  for (const f of fields) {
    // Only the final shot closes the piece.
    if (f === "transOut" && shotIdx !== state.shots.length - 1) continue;
    const sh = shotIdx == null ? null : state.shots[shotIdx];
    const val = settingLabel(f, sh);
    const b = el("button", "setchip" + (val ? "" : " unset"));
    b.type = "button";
    b.dataset.set = key(f);
    b.setAttribute("aria-pressed", String(state.openField === key(f)));
    const name = (f === "transIn" && shotIdx > 0) ? `From shot ${shotIdx}` : FIELD[f].label;
    b.innerHTML = `<span class="k">${name}</span><span class="v">${val || "—"}</span>`;
    b.addEventListener("click", () => {
      state.openField = state.openField === key(f) ? null : key(f);
      if (shotIdx != null) state.activeShot = shotIdx;
      renderStep();
    });
    row.appendChild(b);
  }
  wrap.appendChild(row);

  const openF = fields.find(f => state.openField === key(f));
  if (openF) {
    if (shotIdx != null) state.activeShot = shotIdx;
    const panel = el("div", "editor");
    panel.appendChild(cardGrid(openF));
    const done = el("button", "more", "Done");
    done.type = "button";
    done.addEventListener("click", () => { state.openField = null; renderStep(); });
    panel.appendChild(done);
    wrap.appendChild(panel);
  }
  return wrap;
}

/** Storyboard tile for one shot — its framing preview, number and duration. */
function shotTile(sh, i) {
  const b = el("button", "tile");
  b.type = "button";
  b.setAttribute("aria-pressed", String(state.selectedShot === i));
  const pv = sh.framing ? preview("framing", sh.framing)
    : `<svg class="pv" viewBox="0 0 100 100" aria-hidden="true"><rect x="-40" y="-40" width="180" height="180" fill="#191a1e"/>` +
      `<rect x="26" y="32" width="48" height="36" rx="3" fill="none" stroke="#4a4a52" stroke-width="2" stroke-dasharray="5 4"/></svg>`;
  const first = (sh.scene || "").trim().split(/\s+/).slice(0, 7).join(" ");
  b.innerHTML =
    `<span class="tframe">${pv}<span class="tnum">${i + 1}</span><span class="tdur">${sh.dur}s</span></span>` +
    `<span class="tcap">${first ? first + (sh.scene.trim().split(/\s+/).length > 7 ? "…" : "") : "<em>empty</em>"}</span>`;
  b.addEventListener("click", () => {
    state.selectedShot = i; state.openField = null; state.activeShot = i;
    renderStep();
  });
  return b;
}

function renderShots() {
  const frag = document.createDocumentFragment();
  const total = totalDur(), spare = MAX_TOTAL - total;

  const head = el("div", "runbar");
  head.appendChild(el("span", "runlabel", "Runtime"));
  const bar = el("div", "bar");
  state.shots.forEach(sh => { const s = el("span"); s.style.width = (sh.dur / MAX_TOTAL * 100) + "%"; bar.appendChild(s); });
  head.appendChild(bar);
  head.appendChild(el("span", "runval" + (spare === 0 ? " full" : ""), `${total}s / ${MAX_TOTAL}s`));
  frag.appendChild(head);

  const p = PRESETS.find(x => x.id === state.preset);

  // The model writes this list on a network round trip; say so while it runs,
  // and say what happened if it didn't work.
  if (vision.status === "directing") {
    frag.appendChild(el("div", "directing",
      `<span class="dot"></span>Reading ${vision.of} reference${vision.of === 1 ? "" : "s"} &mdash; writing the shot list`));
  } else if (vision.status === "failed" && vision.note) {
    frag.appendChild(el("div", "directing dfail", vision.note));
  }

  // Re-run the director: after retagging references, adding an image, or just
  // to see a different take on the same preset.
  if (canDirect(p) && vision.status !== "directing") {
    const again = el("button", "rebuild",
      `Rewrite this shot list from the references with ${provider().label}`);
    again.type = "button";
    again.addEventListener("click", () => runDirector(p));
    frag.appendChild(again);
  }

  // References added after the preset was chosen aren't in the list until it
  // is expanded again.
  if (p && p.recipe.some(b => b.role === "per")) {
    const n = Math.min(MAX_SHOTS, p.recipe.filter(b => b.role === "per")
      .reduce((a, b) => a + Math.max(1, state.refs.filter(r => r.cat === b.cat).length), 0)
      + p.recipe.filter(b => b.role !== "per").length);
    if (n !== state.shots.length) {
      const rb = el("button", "rebuild",
        `Rebuild from references &mdash; ${state.refs.length} image${state.refs.length === 1 ? "" : "s"} would give ${n} shots`);
      rb.type = "button";
      rb.addEventListener("click", () => { applyPreset(p); state.selectedShot = 0; renderStep(); renderRail(); });
      frag.appendChild(rb);
    }
  }

  // storyboard
  const grid = el("div", "tiles");
  state.shots.forEach((sh, i) => grid.appendChild(shotTile(sh, i)));
  if (state.shots.length < MAX_SHOTS && spare >= MIN_SHOT) {
    const add = el("button", "tile addtile", `<span class="tframe"><span class="plus">+</span></span><span class="tcap">Add a shot</span>`);
    add.type = "button";
    add.addEventListener("click", () => {
      state.shots.push(newShot(Math.max(MIN_SHOT, Math.min(3, MAX_TOTAL - totalDur()))));
      rebalance(); state.selectedShot = state.shots.length - 1; state.activeShot = state.selectedShot;
      renderStep(); renderRail();
    });
    grid.appendChild(add);
  }
  frag.appendChild(grid);

  // the selected shot's editor
  const i = Math.min(state.selectedShot, state.shots.length - 1);
  const sh = state.shots[i];
  if (sh) {
    const card = el("div", "shotcard");
    const hd = el("div", "shothead");
    hd.appendChild(el("span", "shotn", `Shot ${i + 1}`));
    const minus = el("button", "step-btn", "&minus;");
    minus.type = "button"; minus.disabled = sh.dur <= MIN_SHOT;
    minus.addEventListener("click", () => { sh.dur--; renderStep(); });
    const val = el("span", "shotdur", `${sh.dur}s`);
    const plus = el("button", "step-btn", "+");
    plus.type = "button"; plus.disabled = spare <= 0;
    plus.addEventListener("click", () => { sh.dur++; rebalance(); renderStep(); });
    hd.append(minus, val, plus);
    if (state.shots.length > 1) {
      const del = el("button", "shotdel", "Remove");
      del.type = "button";
      del.addEventListener("click", () => {
        state.shots.splice(i, 1);
        state.openField = null;
        state.selectedShot = Math.max(0, Math.min(i, state.shots.length - 1));
        state.activeShot = state.selectedShot;
        renderStep(); renderRail();
      });
      hd.appendChild(del);
    }
    card.appendChild(hd);

    for (const [f, rows] of [["scene", 3], ["action", 2]]) {
      const ta = Object.assign(document.createElement("textarea"), { rows, value:sh[f] });
      ta.placeholder = f === "scene" ? FIELD.scene.placeholder : FIELD.action.placeholder;
      ta.className = "shottext" + (f === "action" ? " sub" : "");
      // Repaint the prompt and this shot's tile, but never re-render the step —
      // that would blur the field mid-sentence.
      ta.addEventListener("input", () => {
        sh[f] = ta.value; refreshPrompt(); refreshTile(i); renderRail();
      });
      card.appendChild(ta);
    }
    if (state.refs.length) {
      const row = el("div", "refins");
      state.refs.forEach((r, n) => {
        const b = el("button", "refchip", `ref ${n + 1}`);
        b.type = "button";
        b.title = describeRef(r);
        b.addEventListener("click", () => {
          const ta = card.querySelector("textarea");
          const at = ta.selectionStart ?? ta.value.length;
          ta.value = ta.value.slice(0, at) + `ref ${n + 1}` + ta.value.slice(ta.selectionEnd ?? at);
          sh.scene = ta.value; ta.focus(); refreshPrompt(); refreshTile(i);
        });
        row.appendChild(b);
      });
      card.appendChild(row);
    }
    card.appendChild(settingsRow(SHOT_SETTINGS, i));
    frag.appendChild(card);
  }

  const look = el("div", "shotcard look");
  look.appendChild(el("div", "shothead", `<span class="shotn">Whole piece</span>`));
  look.appendChild(settingsRow(LOOK_SETTINGS, null));
  frag.appendChild(look);

  frag.appendChild(promptBlock());
  return frag;
}

/** Repaint one storyboard tile in place. */
function refreshTile(i) {
  const tiles = document.querySelectorAll(".tiles .tile");
  if (!tiles[i] || !state.shots[i]) return;
  tiles[i].replaceWith(shotTile(state.shots[i], i));
}

/** The live prompt, pinned to the bottom of the shot list. */
function promptBlock() {
  const pw = el("div", "promptwrap");
  const head = el("div", "prompt-head",
    `<h3>Prompt &mdash; ${state.shots.length} shot${state.shots.length > 1 ? "s" : ""} &middot; ${totalDur()}s</h3>`);
  const seg = el("div", "seg");
  for (const [f, label] of [["prose", "Prose"], ["labeled", "Labeled"]]) {
    const b = el("button", null, label);
    b.type = "button"; b.dataset.format = f;
    b.setAttribute("aria-pressed", String(state.format === f));
    b.addEventListener("click", () => {
      state.format = f;
      for (const x of seg.children) x.setAttribute("aria-pressed", String(x === b));
      refreshPrompt();
    });
    seg.appendChild(b);
  }
  head.appendChild(seg);
  const cp = el("button", "btn btn-accent", "Copy");
  cp.type = "button"; cp.style.cssText = "padding:.45rem 1.1rem;font-size:.8rem";
  cp.addEventListener("click", () => copyPrompt(cp));
  head.appendChild(cp);
  pw.appendChild(head);
  pw.appendChild(Object.assign(document.createElement("textarea"), { id:"output", readOnly:true, spellcheck:false }));
  pw.appendChild(el("div", "meter", `<span>Words <b id="wc">0</b></span><span>Characters <b id="cc">0</b></span>`));
  return pw;
}

/** Recompute the prompt text only — cheap enough to run on every keystroke. */
function refreshPrompt() {
  const out = document.getElementById("output");
  if (!out) return;
  const text = promptText();
  out.value = text.trim() ? text : "Nothing written yet — pick a preset or fill in a shot.";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const wc = document.getElementById("wc"), cc = document.getElementById("cc");
  if (wc) wc.textContent = words;
  if (cc) cc.textContent = text.length;
  const h = document.querySelector(".prompt-head h3");
  if (h) h.textContent = `Prompt — ${state.shots.length} shot${state.shots.length > 1 ? "s" : ""} · ${totalDur()}s`;
}

function renderPresets() {
  const f = el("div", "field");
  const groups = [...new Set(PRESETS.map(p => p.group))]
    .sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
  // Thirty-odd presets only stay scannable collapsed; the first group and any
  // group holding the current pick start open.
  if (!state.openGroups.size) state.openGroups.add(groups[0]);
  const cur = PRESETS.find(x => x.id === state.preset);
  if (cur) state.openGroups.add(cur.group);
  for (const gname of groups) {
    const members = PRESETS.filter(x => x.group === gname);
    const open = state.openGroups.has(gname);
    const hdr = el("button", "groupbtn" + (open ? " open" : ""));
    hdr.type = "button";
    hdr.setAttribute("aria-expanded", String(open));
    hdr.innerHTML = `<span class="caret">${open ? "&minus;" : "+"}</span><span class="gname">${gname}</span>` +
      `<span class="gcount">${members.length}</span>`;
    hdr.addEventListener("click", () => {
      open ? state.openGroups.delete(gname) : state.openGroups.add(gname);
      renderStep();
    });
    f.appendChild(hdr);
    if (!open) continue;
    const grid = el("div", "presets");
    for (const p of members) {
      const b = el("button", "preset");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.preset === p.id));
      // Expand against the actual uploads so the card previews what this
      // preset would build right now, not a fixed example.
      const shots = expandPreset(p);
      const total = shots.reduce((a, s) => a + s.dur, 0);
      const beats = shots.map((s, i) =>
        `<span class="beat"><b>${i + 1}</b> ${s.framing ? item("framing", s.framing)[1] : "Open"}` +
        `${s.motion && s.motion.length ? " &middot; " + item("motion", s.motion[0])[1] : ""}` +
        `<i>${s.dur}s</i></span>`).join("");
      b.innerHTML =
        `<span class="thumb">${p.pv ? preview(p.pv[0], p.pv[1])
          : `<svg class="pv" viewBox="0 0 100 100" aria-hidden="true"><rect x="-40" y="-40" width="180" height="180" fill="#191a1e"/>` +
            `<rect x="22" y="30" width="56" height="40" rx="3" fill="none" stroke="#5a5a66" stroke-width="2" stroke-dasharray="5 4"/>` +
            `<path d="M50 42v16M42 50h16" stroke="#5a5a66" stroke-width="2" stroke-linecap="round"/></svg>`}</span>` +
        `<span class="txt"><h4>${p.name}</h4><p>${p.sum}</p>` +
        `<span class="beats">${beats}</span>` +
        `<span class="meta">${shots.length} shot${shots.length > 1 ? "s" : ""} &middot; ${total}s total</span></span>`;
      b.addEventListener("click", () => choosePreset(p));
      grid.appendChild(b);
    }
    f.appendChild(grid);
  }
  return f;
}

/** Vision panel: pick a provider, hold its key, describe the uploaded images. */
function visionPanel() {
  const box = el("div", "vpanel");
  // Re-find the mounted panel; closing over `box` would leave every repaint
  // after the first writing into a detached node.
  const repaint = () => {
    const cur = document.querySelector(".vpanel");
    if (cur) cur.replaceWith(visionPanel());
  };
  const P = provider();

  /* A key ships with the file, so there is nothing to ask for and nothing to
   * choose. No key field, no provider switch, no links — just what is about to
   * happen and a button to see the names early. */
  if (usingBuiltIn()) {
    const row = el("div", "vhead");
    row.appendChild(el("span", "vlabel", "Scene reading &mdash; ready"));
    if (vision.status === "working") row.appendChild(el("span", "vpct", `${vision.done} of ${vision.of}`));
    const peek = el("button", "btn btn-ghost", "Describe now");
    peek.type = "button";
    peek.style.cssText = "padding:.5rem 1.1rem;font-size:.8rem";
    peek.disabled = !state.refs.length || vision.status === "working";
    peek.addEventListener("click", describeAll);
    row.appendChild(peek);
    box.appendChild(row);

    box.appendChild(el("p", "hint",
      `Your images are read for you. Pick a preset on the next step and it names every reference ` +
      `and writes the shot list from them &mdash; nothing to set up. Describe now if you'd rather ` +
      `see the names before choosing.`));
    if (vision.note) box.appendChild(el("p", "hint", `<span class="vwarn">${vision.note}</span>`));
    return box;
  }

  const head = el("div", "vhead");
  head.appendChild(el("span", "vlabel", "Identify scene elements"));
  if (vision.status === "working") head.appendChild(el("span", "vpct", `${vision.done} of ${vision.of}`));
  const seg = el("div", "seg");
  for (const [pid, def] of Object.entries(PROVIDERS)) {
    const b = el("button", null, def.label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(vision.provider === pid));
    // Each provider keeps its own key, so switching never discards the other.
    b.addEventListener("click", () => { vision.provider = pid; vision.note = ""; renderStep(); });
    seg.appendChild(b);
  }
  head.appendChild(seg);
  box.appendChild(head);

  const row = el("div", "keyrow");
  const input = Object.assign(document.createElement("input"), {
    type:"password", value:getKey(), placeholder:P.placeholder,
  });
  input.className = "keyinput";
  input.autocomplete = "off"; input.spellcheck = false;
  row.appendChild(input);

  const save = el("button", "btn btn-ghost", hasKey() ? "Update" : "Save key");
  save.type = "button";
  save.style.cssText = "padding:.5rem 1rem;font-size:.8rem";
  // Full re-render: the per-image buttons on each card are gated on a key.
  save.addEventListener("click", () => { setKey(input.value.trim()); vision.note = ""; renderStep(); });
  row.appendChild(save);

  const go = el("button", "btn btn-accent", "Describe all");
  go.type = "button";
  go.style.cssText = "padding:.5rem 1.1rem;font-size:.8rem";
  go.disabled = !hasKey() || !state.refs.length || vision.status === "working";
  go.addEventListener("click", describeAll);
  row.appendChild(go);
  box.appendChild(row);

  box.appendChild(el("p", "hint",
    hasKey()
      ? `Key saved in this browser. Uses <code>${P.models[0]}</code>. ` +
        `Naming your images here is optional &mdash; whichever preset you pick next reads them all anyway ` +
        `and writes the shot list from them. Describe now if you'd rather check the names first. ` +
        `Images are sent to ${P.label} only when you press Describe, or when you pick a preset.`
      : `Paste a ${P.label} key &mdash; ${P.hint}. Stored in this browser only. With one, the preset you ` +
        `pick next writes your shot list from these images; without one it expands from its own wording. ` +
        `A ChatGPT key can't be used from a page like this: OpenAI's API sends no CORS headers, so the browser blocks the call.`));
  if (vision.note) box.appendChild(el("p", "hint", `<span class="vwarn">${vision.note}</span>`));
  // Only reachable with the key constants left blank; a built-in key returns
  // the simple panel above and never gets here.
  if (hasKey()) {
    const forget = el("button", "vclear", `Forget ${P.label} key`);
    forget.type = "button";
    forget.addEventListener("click", () => { setKey(""); vision.note = ""; renderStep(); });
    const wrap = el("p", "hint");
    wrap.appendChild(forget);
    box.appendChild(wrap);
  }
  return box;
}

/** Caption every reference in turn, one call each. Optional now that picking a
 *  preset reads them all anyway — this is the early look, for checking the
 *  names before committing to a preset. */
async function describeAll() {
  if (!hasKey() || !state.refs.length || vision.status === "working") return;
  vision.status = "working"; vision.note = ""; vision.done = 0; vision.of = state.refs.length;
  renderStep();
  for (const r of state.refs) {
    r.busy = true; renderStep();
    await describeOne(r);
    r.busy = false; vision.done++;
    if (vision.note) break;              // stop the run on the first real failure
    renderStep();
  }
  vision.status = vision.note ? "failed" : "idle";
  renderStep();
}

/** Caption one reference and write the result into state. Callers re-render. */
async function describeOne(r) {
  if (!r.url) return false;
  const got = await captionImage(r.url);
  if (got && got.subject) {
    r.subject = got.subject;
    r.detail = got.detail || "";
    r.elements = got.elements || [];
    renderRail();
    return true;
  }
  return false;
}

function renderRefs() {
  const frag = document.createDocumentFragment();
  const drop = el("div", "drop", `<strong>Drop images here</strong><span>or click to browse</span>`);
  drop.addEventListener("click", () => document.getElementById("filein").click());
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  const f = el("div", "field");
  f.appendChild(drop);
  frag.appendChild(f);

  if (state.refs.length) frag.appendChild(visionPanel());

  if (state.refs.length) {
    const grid = el("div", "refgrid");
    state.refs.forEach((r, i) => {
      const card = el("div", "ref");
      const cat = REF_CATS.find(c => c[0] === r.cat);
      card.innerHTML =
        `<div class="thumb"><span class="tag">ref ${i + 1} &middot; ${cat[1]}</span>` +
        `<button class="del" type="button" title="Remove">&times;</button>` +
        `<img src="${r.url}" alt="${r.name}"></div><div class="body"><div class="cats"></div></div>`;
      card.querySelector(".del").addEventListener("click", () => { state.refs.splice(i, 1); renderStep(); renderRail(); });
      const cats = card.querySelector(".cats");
      for (const [cid, clabel] of REF_CATS) {
        const b = el("button", "chip", clabel);
        b.type = "button";
        b.setAttribute("aria-pressed", String(r.cat === cid));
        b.addEventListener("click", () => { r.cat = cid; renderStep(); refreshPrompt(); });
        cats.appendChild(b);
      }
      const body = card.querySelector(".body");

      // The only thing pixels can't tell us: what the thing actually is.
      const subj = Object.assign(document.createElement("input"), { type:"text", value:r.subject });
      subj.placeholder = { character:"orc warchief", environment:"fortress courtyard",
        product:"cordless drill", style:"key art", lighting:"lighting setup",
        start:"opening frame" }[r.cat] || "what is it?";
      subj.className = "refsubject";
      subj.addEventListener("input", () => { r.subject = subj.value; paintPhrase(); refreshPrompt(); });
      body.appendChild(el("span", "reflabel", "What is it?"));
      const srow = el("div", "subjrow");
      srow.appendChild(subj);
      // Per-image re-describe, once the model is loaded.
      if (hasKey()) {
        const one = el("button", "vone", r.busy ? "…" : "&#9889;");
        one.type = "button";
        one.title = "Describe this image";
        one.disabled = !!r.busy;
        one.addEventListener("click", async () => {
          one.disabled = true; one.textContent = "…";
          await describeOne(r);
          renderStep();
        });
        srow.appendChild(one);
      }
      body.appendChild(srow);
      if (r.elements && r.elements.length) {
        body.appendChild(el("span", "reflabel", "Elements in the scene"));
        const ex = el("div", "autotags");
        for (const t of r.elements) ex.appendChild(el("span", "eltag", t));
        body.appendChild(ex);
      }
      if (r.detail) {
        body.appendChild(el("span", "reflabel", "Description"));
        body.appendChild(el("p", "refdetail", r.detail));
      }

      // Read off the image itself — no input required.
      if (r.auto) {
        body.appendChild(el("span", "reflabel", "Read from the image"));
        const sw = el("div", "swatches");
        for (const hex of r.auto.swatches) {
          const s = el("span", "sw");
          s.style.background = hex;
          s.title = hex;
          sw.appendChild(s);
        }
        body.appendChild(sw);
        const auto = el("div", "autotags");
        for (const t of [r.auto.temp, r.auto.tone, r.auto.contrast, r.auto.sat])
          auto.appendChild(el("span", "autotag", t));
        body.appendChild(auto);
      }

      // Live preview of the phrase this reference contributes.
      const out = el("p", "refphrase");
      const paintPhrase = () => { out.textContent = describeRef(r); };
      paintPhrase();
      body.appendChild(out);
      grid.appendChild(card);
    });
    frag.appendChild(grid);
  }
  return frag;
}

function renderStep(entering = false) {
  const s = STEPS[state.step];
  stageEl.innerHTML = "";
  const wrap = el("div", "step" + (entering ? " enter" : ""));
  if (entering) wrap.addEventListener("animationend", () => wrap.classList.remove("enter"), { once:true });
  wrap.appendChild(el("div", "step-num", `${pad(state.step + 1)} / ${s.name}`));
  wrap.appendChild(el("h2", null, s.q));
  wrap.appendChild(el("p", "lede", s.sub));
  wrap.appendChild(el("div", "rule"));

  if (s.id === "refs") wrap.appendChild(renderRefs());
  else if (s.id === "preset") wrap.appendChild(renderPresets());
  else wrap.appendChild(renderShots());

  const nav = el("div", "nav");
  const back = el("button", "btn btn-ghost", "&larr; Back");
  back.type = "button"; back.disabled = state.step === 0;
  back.addEventListener("click", () => goto(state.step - 1));
  nav.appendChild(back);
  nav.appendChild(el("span", "count", `${pad(state.step + 1)} / ${pad(STEPS.length)}`));
  if (state.step < STEPS.length - 1) {
    const next = el("button", "btn", (s.id === "refs" ? "Choose a preset" : "Next") + " &rarr;");
    next.type = "button";
    next.addEventListener("click", () => goto(state.step + 1));
    nav.appendChild(next);
  }
  wrap.appendChild(nav);
  stageEl.appendChild(wrap);
  refreshPrompt();
}

function goto(i) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  state.visited.add(state.step);
  renderStep(true); renderRail();
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---- reference intake ---------------------------------------------------- */

document.getElementById("filein").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

function addFiles(files) {
  for (const file of [...files]) {
    if (!file.type.startsWith("image/")) continue;
    // Claim the slot up front. Reads and analyses finish out of order, and ref
    // numbers are cited in the prompt, so they must follow the upload order.
    const ref = { url:"", name:file.name, cat:"character", subject:"", auto:null, detail:"", elements:[], busy:false };
    state.refs.push(ref);
    const reader = new FileReader();
    reader.onload = () => downscale(reader.result).then(url => {
      ref.url = url;
      renderStep(); renderRail();
      analyseImage(url).then(auto => { ref.auto = auto; renderStep(); renderRail(); });
    });
    reader.readAsDataURL(file);
  }
}

/** Thumbnails are all we ever show, so shrink on import to keep the DOM light. */
function downscale(dataUrl, max = 512) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      if (sc === 1) return res(dataUrl);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .85));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

/* ===========================================================================
 * 6. Prompt composition
 * ======================================================================== */

function sentence(s) {
  s = String(s).trim();
  if (!s) return "";
  s = s[0].toUpperCase() + s.slice(1);
  return /[.!?]$/.test(s) ? s : s + ".";
}
const clause = s => String(s).trim().replace(/[.]+$/, "");
function joinList(a) {
  if (a.length <= 1) return a[0] || "";
  if (a.length === 2) return a[0] + " and " + a[1];
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}
const startRef = () => state.refs.findIndex(r => r.cat === "start");

/** Camera + lighting sentences for one shot. */
function shotBody(sh) {
  const out = [];
  const frame = [];
  if (sh.framing) frame.push("Framed as " + clause(prose("framing", sh.framing)));
  if (sh.angle) frame.push(clause(prose("angle", sh.angle)));
  // Lens and depth of field read as one clause: "on a 50mm lens with shallow depth of field".
  const optics = [];
  if (sh.lens) optics.push(clause(prose("lens", sh.lens)));
  if (sh.dof) optics.push(clause(prose("dof", sh.dof)));
  if (optics.length) frame.push((sh.framing ? "shot on " : "on ") + optics.join(" with "));
  // Without a framing choice the sentence has no subject, so supply one.
  if (frame.length) out.push(sh.framing ? frame.join(", ") + "." : sentence("Captured " + frame.join(", ")));

  if (sh.motion.length) {
    const speed = sh.speed ? clause(prose("speed", sh.speed)) + " " : "";
    const moves = sh.motion.map(id => clause(item("motion", id)[2]));
    out.push(moves.length === 1
      ? sentence("the camera " + speed + moves[0])
      : sentence("the camera " + speed + moves[0] + ", then " + moves[1]));
  }
  if (sh.light) out.push(sentence("Lit by " + clause(prose("light", sh.light)) + (sh.temp ? ", " + clause(prose("temp", sh.temp)) : "")));
  else if (sh.temp) out.push(sentence("The lighting is " + clause(prose("temp", sh.temp))));
  return out.join(" ");
}

function buildProse() {
  const paras = [];
  const multi = state.shots.length > 1;

  if (state.refs.length) {
    paras.push("References:\n" + state.refs.map((r, i) => {
      const cat = REF_CATS.find(c => c[0] === r.cat);
      return `  ref ${i + 1} — ${cat[1]}: ${describeRef(r)}` +
        (r.detail ? `\n      ${r.detail}` : "") +
        (r.elements && r.elements.length ? `\n      in scene: ${r.elements.join(", ")}` : "");
    }).join("\n"));
    // Group by category, or three character refs read as three near-identical
    // clauses ("the character to ref 1, the character to ref 2, …").
    const bind = [];
    for (const [cid, , role] of REF_CATS) {
      if (cid === "start") continue;
      const ns = state.refs.map((r, i) => r.cat === cid ? i + 1 : 0).filter(Boolean);
      if (!ns.length) continue;
      bind.push(ns.length === 1
        ? `${role} to ref ${ns[0]}`
        : `${role}s to refs ${joinList(ns.map(String))}`);
    }
    if (bind.length) paras.push(sentence("Match " + joinList(bind)));
  }

  const sr = startRef();
  paras.push(state.refs.length
    ? `Animate from the provided reference images${sr >= 0 ? `, opening on ref ${sr + 1}` : ""}. ` +
      "Preserve the design, materials and colour of the references."
    : "Animate from the provided reference image. Preserve its design, materials and colour.");

  state.shots.forEach((sh, i) => {
    const lead = [];
    if (multi) lead.push(`Shot ${i + 1} (${sh.dur}s).`);
    if (sh.scene.trim()) lead.push(sentence(sh.scene));
    if (sh.action.trim()) lead.push(sentence(sh.action));
    const body = shotBody(sh);
    if (body) lead.push(body);
    if (lead.length) paras.push(lead.join(" "));
  });

  // Runtime alone isn't worth a paragraph — only state the finish once the
  // piece actually has something in it.
  const described = state.shots.some(sh => sh.scene.trim() || sh.action.trim() || shotBody(sh)) ||
    state.style || state.cadence || state.atmos.length;
  if (described) {
    const look = [];
    if (state.atmos.length) look.push(sentence(joinList(state.atmos.map(id => clause(item("atmos", id)[2]))) + " throughout"));
    const finish = [];
    if (state.style) finish.push(clause(item("style", state.style)[2]));
    if (state.cadence) finish.push(clause(item("cadence", state.cadence)[2]));
    finish.push(multi
      ? `${state.shots.length} shots running ${totalDur()} seconds in total`
      : `approximately ${state.shots[0].dur} second${state.shots[0].dur > 1 ? "s" : ""}`);
    look.push(sentence(finish.join(", ")));
    paras.push(look.join(" "));
  }

  const trans = [];
  const first = state.shots[0], last = state.shots[state.shots.length - 1];
  if (first.transIn) trans.push(sentence("Opens with " + clause(prose("transIn", first.transIn))));
  for (let i = 1; i < state.shots.length; i++) {
    const t = state.shots[i].transIn;
    // "with" rather than "on" — several fragments already carry their own "on".
    // The trailing "in" reads as an opening ("a dissolve in"), wrong mid-cut.
    if (t) trans.push(sentence(`Shot ${i} moves to shot ${i + 1} with ` +
      clause(prose("transIn", t)).replace(/\s+in$/, "")));
  }
  if (last.transOut) trans.push(sentence("Ends with " + clause(prose("transOut", last.transOut))));
  if (trans.length) paras.push(trans.join(" "));

  return paras.join("\n\n");
}

function buildLabeled() {
  const L = [];
  if (state.refs.length) {
    L.push("References:");
    state.refs.forEach((r, i) => {
      const cat = REF_CATS.find(c => c[0] === r.cat);
      L.push(`  ref ${i + 1} — ${cat[1]}: ${describeRef(r)}`);
      if (r.detail) L.push(`      ${r.detail}`);
      if (r.elements && r.elements.length) L.push(`      in scene: ${r.elements.join(", ")}`);
    });
  }
  L.push("Source: provided reference images" +
    (startRef() >= 0 ? ` — open on ref ${startRef() + 1}` : "") +
    " — preserve design, materials and colour");
  L.push(`Shots: ${state.shots.length} (${state.shots.map(s => s.dur + "s").join(" + ")} = ${totalDur()}s)`);

  const PER = [["scene","Scene"],["action","Action"],["framing","Shot"],["angle","Angle"],["lens","Lens"],
    ["dof","Depth of field"],["motion","Camera"],["speed","Speed"],["light","Lighting"],["temp","Color"],
    ["transIn","Transition in"],["transOut","Transition out"]];

  state.shots.forEach((sh, i) => {
    const lines = [];
    for (const [f, key] of PER) {
      if (f === "transOut" && i !== state.shots.length - 1) continue;
      const v = sh[f];
      let val;
      if (FIELD[f].type) val = (v || "").trim();
      else if (Array.isArray(v)) val = v.map(x => clause(item(f, x)[2])).join(", ");
      else val = v ? clause(item(f, v)[2]) : "";
      if (val) lines.push(`  ${f === "transIn" && i > 0 ? "Enters on" : key}: ${val}`);
    }
    if (lines.length) L.push("", `[Shot ${i + 1} — ${sh.dur}s]`, ...lines);
  });

  const tail = [];
  if (state.style) tail.push("Style: " + clause(item("style", state.style)[2]));
  if (state.cadence) tail.push("Cadence: " + clause(item("cadence", state.cadence)[2]));
  if (state.atmos.length) tail.push("Atmosphere: " + state.atmos.map(a => clause(item("atmos", a)[2])).join(", "));
  if (tail.length) L.push("", ...tail);
  return L.join("\n");
}

const promptText = () => state.format === "prose" ? buildProse() : buildLabeled();

async function copyPrompt(btn) {
  const t = promptText();
  if (!t.trim()) return;
  await navigator.clipboard.writeText(t);
  const old = btn.textContent;
  btn.textContent = "Copied";
  setTimeout(() => { btn.textContent = old; }, 1200);
}

renderStep(true); renderRail();
</script>
</body>
